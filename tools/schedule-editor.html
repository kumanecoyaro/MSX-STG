<meta charset="utf-8">
<title>CYBER_SUZUKA — Spawn Schedule Editor</title>
<style>
  :root {
    --bg: #05080d;
    --surface: #0b1220;
    --surface-2: #0e1626;
    --line: #17233a;
    --grid-line: #1a2f52;
    --grid-line-strong: #2c58a0;
    --ink: #eaf1fb;
    --ink-dim: #7f93ad;
    --ink-faint: #4c5f7d;
    --accent: #4fd2ff;
    --accent-ink: #04141c;
    --danger: #ff5d6c;
    --danger-ink: #260607;
    --ok: #6bdc7c;

    --hue-simple: #b98cff;
    --hue-e2a: #ff8fc6;
    --hue-e2b: #ff5f9e;
    --hue-e3: #38d9c4;
    --hue-e4: #ffa94d;
    --hue-e5: #6bdc7c;
    --hue-boss: #ff5d5d;

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: row;
    height: 100vh;
  }

  button, .btn-label {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 7px 8px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  /* .btn-label wraps the hidden file input directly (native label-for
     file-picker trigger) instead of a button that proxies a JS .click()
     onto it - synthetic clicks on file inputs are unreliable inside a
     sandboxed frame, this isn't. */
  .btn-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  button:hover, .btn-label:hover { border-color: var(--ink-faint); }
  button:active, .btn-label:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger-btn { background: var(--surface-2); color: var(--danger); border-color: #4a2226; }
  button.danger-btn.armed { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }

  /* ---------- grid area (left, fills remaining space) ---------- */
  .gridwrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  .ruler-row {
    display: flex;
    flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .gutter-corner {
    flex: 0 0 var(--gutter-w);
    background: var(--surface);
  }
  .ruler-scroll {
    overflow: hidden;
    flex: 1 1 auto;
  }
  #ruler {
    display: block;
  }

  .grid-row {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  .row-gutter-scroll {
    overflow: hidden;
    flex: 0 0 var(--gutter-w);
  }
  #rowGutter { display: block; }

  .canvas-scroll {
    flex: 1 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    touch-action: pan-x;
  }
  #grid {
    display: block;
    cursor: crosshair;
  }

  /* ---------- right sidebar: identity, stats, actions, palette ---------- */
  /* Kept deliberately thin - the grid is the workspace, the sidebar is */
  /* just controls. Palette entries are small color chips (number+code, */
  /* the same glyph the grid itself draws for a placement) rather than  */
  /* name+description cards, so 13 enemy types cost a few rows, not a   */
  /* scroll-hogging list. Full names live in the title attr + the       */
  /* one-line "armed" readout, not baked into every chip.               */
  aside {
    flex: 0 0 196px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .side-title {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .side-title .name {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .side-title .sub {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  .side-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .side-actions button, .side-actions .btn-label { width: 100%; padding: 6px 6px; font-size: 11px; }
  .side-actions .full { grid-column: 1 / -1; }

  .palette {
    overflow-y: auto;
    padding: 5px 8px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
    min-height: 0;
  }
  .pitem {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .pitem:hover { filter: brightness(1.08); }
  .pitem.armed {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .pitem .picon { display: block; pointer-events: none; }

  #liveMsg {
    position: fixed;
    left: calc(50% - 118px);
    bottom: 22px;
    transform: translate(-50%, 8px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
    max-width: min(70vw, 480px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #liveMsg.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 8, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    width: min(560px, 100%);
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .overlay-title { font-size: 13px; font-weight: 600; }
  #offsetInput {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 15px;
  }
  .overlay-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .overlay-actions button { padding: 8px 14px; }
  /* Inline, not the bottom-fixed toast - on mobile a toast at the
     screen edge can end up hidden behind the on-screen keyboard right
     after typing/pasting into the textarea above, making a real error
     silently invisible. This sits in the card itself instead. */
  .overlay-status {
    font-size: 11.5px;
    color: var(--danger);
    min-height: 1.2em;
  }
  .overlay-status.ok { color: var(--ok); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- narrow viewports (phone, or a narrow browser pane): ---------- */
  /* the grid is the whole point, so it stays full-width and on top; the    */
  /* sidebar drops below as a short, capped-height strip instead of eating  */
  /* most of the screen's width down a 236px column.                       */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .gridwrap { height: auto; flex: 1 1 auto; min-height: 0; }
    aside {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      max-height: 42vh;
      border-left: none;
      border-top: 1px solid var(--line);
    }
    .side-title { display: none; }
    .side-actions { grid-template-columns: repeat(4, 1fr); padding: 6px 10px; }
    .side-actions .full { grid-column: auto; }
  }
</style>

<body>
  <div class="gridwrap">
    <div class="ruler-row">
      <div class="gutter-corner"></div>
      <div class="ruler-scroll"><canvas id="ruler"></canvas></div>
    </div>
    <div class="grid-row">
      <div class="row-gutter-scroll"><canvas id="rowGutter"></canvas></div>
      <div class="canvas-scroll" id="canvasScroll">
        <canvas id="grid"></canvas>
      </div>
    </div>
  </div>

  <aside>
    <div class="side-title">
      <div class="name">CYBER_SUZUKA</div>
      <div class="sub">spawn schedule editor</div>
    </div>

    <div class="side-actions">
      <button class="primary full" id="btnSave">Save JSON</button>
      <button class="danger-btn full" id="btnErase">Erase</button>
      <button class="full" id="btnUndo" disabled>Undo</button>
      <button id="btnPrev" title="Scroll back one screen (32 ticks)">◀</button>
      <button id="btnNext" title="Scroll forward one screen (32 ticks)">▶</button>
      <label class="btn-label" for="fileInput">Load JSON</label>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>

    <div class="palette" id="palette"></div>
  </aside>

  <div id="liveMsg"></div>

  <div id="offsetOverlay" class="overlay">
    <div class="overlay-card" style="width: min(320px, 100%);">
      <div class="overlay-title" id="offsetOverlayTitle">Edit offset</div>
      <input type="number" id="offsetInput" inputmode="numeric" step="1" min="0">
      <div class="overlay-status" id="offsetStatus"></div>
      <div class="overlay-actions">
        <button id="btnOffsetCancel">Cancel</button>
        <button class="primary" id="btnOffsetSave">Save</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- real in-game sprite/pattern data, transcribed byte-for-byte ----------
  // from CYBER_GD_BOSS.asm (see ASTERISK_PATTERN, ENEMY3_PATTERN1, ENEMY4_PATTERN,
  // BOSS_HEX_PATTERN and their draw sites for exact source lines). 16x16 entries use
  // the MSX1 hardware sprite quadrant order [top-left, bottom-left, top-right,
  // bottom-right], 8 bytes each, 1 bit/pixel (bit7=leftmost). "rows" (8x8) is a
  // background/nametable character instead - drawn opaque (bg fill + fg pixels),
  // not transparent like a sprite.
  var GLYPHS = {
    // simple/Enemy1's look - also reused as-is for e2a/e2b's formation members and
    // for enemy5 (TYPE_ENEMY1_LOOK is pixel-identical to Enemy1, just a different
    // BEHAVIOR/score - see REDRAW_UNIT_PATTERN's call sites). Gray, SPR_GRAY(0Eh).
    asterisk16: {
      size: 16,
      quads: {
        tl: [0x00, 0x18, 0x99, 0x5A, 0x3C, 0x5A, 0x99, 0x00],
        bl: [0, 0, 0, 0, 0, 0, 0, 0],
        tr: [0, 0, 0, 0, 0, 0, 0, 0],
        br: [0x00, 0x18, 0x99, 0x5A, 0x3C, 0x5A, 0x99, 0x00]
      },
      color: "#cccccc"
    },
    // Enemy3's pulse animation frame1 (ENEMY3_PATTERN1) - an 8x8 BG tile, not a
    // sprite, so it's opaque: FG gray on BG dark-blue (COLORDATA group19 = E4h).
    enemy3: {
      size: 8,
      rows: [0x00, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0x00],
      color: "#cccccc",
      bg: "#5955e0"
    },
    // Enemy4's static hand-drawn look (ENEMY4_PATTERN) - light green, SPR_LTGREEN(03h).
    enemy4: {
      size: 16,
      quads: {
        tl: [0, 0, 0, 0, 0, 0, 0, 0],
        bl: [0x1F, 0x2F, 0x77, 0xF8, 0x77, 0x2A, 0x1F, 0x0A],
        tr: [0, 0, 0, 0, 0, 0, 0, 0],
        br: [0xF8, 0xF4, 0xEE, 0x15, 0xFF, 0xAA, 0xFC, 0xA8]
      },
      color: "#74d07d"
    },
    // Boss's own compact hex-icon sprite (BOSS_HEX_PATTERN) - used in-game as the
    // materialize/lap-marker glyph, the closest thing to a single-cell "boss icon"
    // rather than trying to shrink the full 5x16-tile BG body. White, always 15 (0Fh)
    // at every draw site that sets it.
    boss: {
      size: 16,
      quads: {
        tl: [0x3C, 0x7E, 0xFF, 0xFF, 0xFF, 0xFF, 0x7E, 0x3C],
        bl: [0, 0, 0, 0, 0, 0, 0, 0],
        tr: [0, 0, 0, 0, 0, 0, 0, 0],
        br: [0, 0, 0, 0, 0, 0, 0, 0]
      },
      color: "#ffffff"
    }
  };

  // Draws a GLYPHS entry into ctx at (x,y), scaled to fill w x h. 8x8 "rows"
  // glyphs paint their bg first (opaque BG tile); 16x16 "quads" glyphs leave
  // 0-bits untouched (transparent sprite, like the real hardware).
  function drawGlyph(ctx, glyph, x, y, w, h) {
    var n = glyph.size, px = w / n, py = h / n;
    if (glyph.bg) { ctx.fillStyle = glyph.bg; ctx.fillRect(x, y, w, h); }
    ctx.fillStyle = glyph.color;
    function paintRows(rows, offX, offY) {
      for (var r = 0; r < rows.length; r++) {
        var byte = rows[r];
        for (var c = 0; c < 8; c++) {
          if (byte & (0x80 >> c)) {
            ctx.fillRect(x + (offX + c) * px, y + (offY + r) * py, Math.ceil(px) + 0.5, Math.ceil(py) + 0.5);
          }
        }
      }
    }
    if (glyph.rows) {
      paintRows(glyph.rows, 0, 0);
    } else {
      paintRows(glyph.quads.tl, 0, 0);
      paintRows(glyph.quads.bl, 0, 8);
      paintRows(glyph.quads.tr, 8, 0);
      paintRows(glyph.quads.br, 8, 8);
    }
  }

  // ---------- enemy palette (matches the current CYBER_GD_BOSS.asm schedule) ----------
  var TYPES = [
    { id: "simple",     name: "Simple (Enemy1)",  desc: "any row - dodge dir is decided from player Y at center", hue: "--hue-simple", defaultRow: 2,  glyph: "asterisk16" },
    { id: "e2a_top",    name: "Enemy2A — Top",    desc: "SPAWN_E2_TOP_A",   hue: "--hue-e2a",    defaultRow: 4,  glyph: "asterisk16" },
    { id: "e2a_bot",    name: "Enemy2A — Bottom", desc: "SPAWN_E2_BOT_A",   hue: "--hue-e2a",    defaultRow: 12, glyph: "asterisk16" },
    { id: "e2b_top",    name: "Enemy2B — Top",    desc: "SPAWN_E2_TOP_B",   hue: "--hue-e2b",    defaultRow: 6,  glyph: "asterisk16" },
    { id: "e2b_bot",    name: "Enemy2B — Bottom", desc: "SPAWN_E2_BOT_B",   hue: "--hue-e2b",    defaultRow: 14, glyph: "asterisk16" },
    { id: "enemy3_wave",name: "Enemy3 — Wave",    desc: "SPAWN_E3_WAVE (budget 32)", hue: "--hue-e3", defaultRow: 1, glyph: "enemy3" },
    { id: "enemy4_y16", name: "Enemy4 — Top",     desc: "baseY 32",         hue: "--hue-e4",     defaultRow: 4,  glyph: "enemy4" },
    { id: "enemy4_y32", name: "Enemy4 — Mid",     desc: "baseY 64",         hue: "--hue-e4",     defaultRow: 8,  glyph: "enemy4" },
    { id: "enemy4_y48", name: "Enemy4 — Bottom",  desc: "baseY 72",         hue: "--hue-e4",     defaultRow: 9,  glyph: "enemy4" },
    { id: "enemy5_y16", name: "Enemy5 — Top",     desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 4,  glyph: "asterisk16" },
    { id: "enemy5_y32", name: "Enemy5 — Mid",     desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 8,  glyph: "asterisk16" },
    { id: "enemy5_y48", name: "Enemy5 — Bottom",  desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 9,  glyph: "asterisk16" },
    { id: "boss",       name: "Boss",             desc: "BOSS_SPAWN",       hue: "--hue-boss",   defaultRow: 20, glyph: "boss" }
  ];
  var TYPE_BY_ID = {};
  TYPES.forEach(function (t) { TYPE_BY_ID[t.id] = t; });

  // ---------- geometry ----------
  var ROWS = 24;
  var MAX_TICK = 400; // scrollable canvas width in cells; game currently uses up to ~270
  var GUTTER_W = 30;
  var RULER_H = 22;
  var CELL = 26; // recomputed in layout() so all 24 rows always fit vertically
  document.documentElement.style.setProperty("--gutter-w", GUTTER_W + "px");

  var css = getComputedStyle(document.documentElement);
  function tok(name) { return css.getPropertyValue(name).trim(); }

  // ---------- state ----------
  var placements = []; // {tick, row, type}
  var armedType = null;
  var eraseArmed = false;

  // ---------- undo ----------
  // Snapshotted before every mutation (place/erase/offset edit/JSON load),
  // not diffed - the schedule stays small enough that a full deep-copy per
  // action costs nothing, and it means undo can never drift from what
  // actually happened.
  var history = [];
  var MAX_HISTORY = 50;
  var btnUndo = document.getElementById("btnUndo");

  function pushHistory() {
    history.push(JSON.parse(JSON.stringify(placements)));
    if (history.length > MAX_HISTORY) history.shift();
    btnUndo.disabled = false;
  }

  function undo() {
    if (!history.length) return;
    placements = history.pop();
    btnUndo.disabled = history.length === 0;
    render();
    flash("undo");
  }

  btnUndo.addEventListener("click", undo);
  window.addEventListener("keydown", function (ev) {
    if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && ev.key.toLowerCase() === "z") {
      ev.preventDefault();
      undo();
    }
  });

  function placementAt(tick, row) {
    for (var i = 0; i < placements.length; i++) {
      if (placements[i].tick === tick && placements[i].row === row) return i;
    }
    return -1;
  }

  function setCell(tick, row, typeId) {
    var idx = placementAt(tick, row);
    if (idx >= 0) placements.splice(idx, 1);
    if (typeId) {
      var p = { tick: tick, row: row, type: typeId };
      // Per-placement, not a derived/shared table - each enemy3_wave cell
      // gets its OWN independent offset (cells, 8px each), defaulting to
      // +0. Placing more than one member of a "set" means placing more
      // than one enemy3_wave cell by hand and editing each's own offset -
      // nothing here auto-generates neighbors.
      if (typeId === "enemy3_wave") p.offset = 0;
      placements.push(p);
    }
    placements.sort(function (a, b) { return a.tick - b.tick || a.row - b.row; });
  }

  // ---------- palette UI ----------
  // Each swatch shows the enemy's real in-game glyph (see GLYPHS) on its
  // hue-tinted background - the hue is kept purely so the 13 types stay
  // tellable apart at a glance (several of them share the exact same
  // gray asterisk sprite in-game - see GLYPHS.asterisk16's comment).
  var paletteEl = document.getElementById("palette");
  TYPES.forEach(function (t) {
    var item = document.createElement("button");
    item.className = "pitem";
    item.dataset.type = t.id;
    item.style.background = "var(" + t.hue + ")";
    item.title = t.name + " — " + t.desc;
    var glyph = GLYPHS[t.glyph];
    var cv = document.createElement("canvas");
    cv.className = "picon";
    var cssSize = 26, dpr = Math.max(1, window.devicePixelRatio || 1);
    cv.width = Math.round(cssSize * dpr);
    cv.height = Math.round(cssSize * dpr);
    cv.style.width = cssSize + "px";
    cv.style.height = cssSize + "px";
    var pctx = cv.getContext("2d");
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var pad = glyph.size === 16 ? 1 : 5;
    drawGlyph(pctx, glyph, pad, pad, cssSize - pad * 2, cssSize - pad * 2);
    item.appendChild(cv);
    item.addEventListener("click", function () {
      eraseArmed = false;
      document.getElementById("btnErase").classList.remove("armed");
      armedType = armedType === t.id ? null : t.id;
      refreshPaletteArmed();
    });
    paletteEl.appendChild(item);
  });

  function refreshPaletteArmed() {
    Array.prototype.forEach.call(paletteEl.children, function (el) {
      el.classList.toggle("armed", el.dataset.type === armedType);
    });
  }

  document.getElementById("btnErase").addEventListener("click", function () {
    armedType = null;
    eraseArmed = !eraseArmed;
    this.classList.toggle("armed", eraseArmed);
    refreshPaletteArmed();
  });

  // ---------- canvases ----------
  var ruler = document.getElementById("ruler");
  var rowGutter = document.getElementById("rowGutter");
  var grid = document.getElementById("grid");
  var canvasScroll = document.getElementById("canvasScroll");
  var rulerScroll = document.querySelector(".ruler-scroll");
  var gridwrap = document.querySelector(".gridwrap");

  var DPR = Math.max(1, window.devicePixelRatio || 1);

  function sizeCanvas(cv, wCss, hCss) {
    cv.width = Math.round(wCss * DPR);
    cv.height = Math.round(hCss * DPR);
    cv.style.width = wCss + "px";
    cv.style.height = hCss + "px";
    var ctx = cv.getContext("2d");
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    return ctx;
  }

  function layout() {
    // all 24 rows must fit in the vertical space left after the ruler - compute
    // the cell size from the available height instead of a fixed pixel value.
    var availH = gridwrap.clientHeight - RULER_H;
    CELL = Math.max(14, Math.min(30, Math.floor(availH / ROWS)));

    var gridW = MAX_TICK * CELL;
    var gridH = ROWS * CELL;

    var gctx = sizeCanvas(grid, gridW, gridH);
    var rctx = sizeCanvas(ruler, gridW, RULER_H);
    var rgctx = sizeCanvas(rowGutter, GUTTER_W, gridH);

    drawRuler(rctx, gridW, RULER_H);
    drawRowGutter(rgctx, GUTTER_W, gridH);
    drawGrid(gctx, gridW, gridH);
  }

  function drawRuler(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textBaseline = "middle";
    for (var t = 0; t <= MAX_TICK; t += 1) {
      var x = t * CELL;
      var strong = t % 32 === 0;
      ctx.strokeStyle = strong ? tok("--grid-line-strong") : tok("--grid-line");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, h - (strong ? 10 : 5));
      ctx.lineTo(x + 0.5, h);
      ctx.stroke();
      if (t % 32 === 0) {
        ctx.fillStyle = tok("--ink");
        ctx.fillText(String(t), x + 3, h - 13);
      }
    }
    ctx.strokeStyle = tok("--line");
    ctx.beginPath();
    ctx.moveTo(0, h - 0.5);
    ctx.lineTo(w, h - 0.5);
    ctx.stroke();
  }

  function drawRowGutter(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (var r = 0; r < ROWS; r++) {
      var y = r * CELL;
      ctx.fillStyle = tok("--ink-dim");
      ctx.fillText(String(r), w - 7, y + CELL / 2);
      ctx.strokeStyle = tok("--grid-line");
      ctx.beginPath();
      ctx.moveTo(w - 5, y + 0.5);
      ctx.lineTo(w, y + 0.5);
      ctx.stroke();
    }
    ctx.textAlign = "left";
  }

  function drawGrid(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--bg");
    ctx.fillRect(0, 0, w, h);

    // 8px-equivalent cell grid, in blue, per spec
    for (var c = 0; c <= MAX_TICK; c++) {
      var strong = c % 32 === 0;
      ctx.strokeStyle = strong ? tok("--grid-line-strong") : tok("--grid-line");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(c * CELL + 0.5, 0);
      ctx.lineTo(c * CELL + 0.5, h);
      ctx.stroke();
    }
    for (var rr = 0; rr <= ROWS; rr++) {
      ctx.strokeStyle = tok("--grid-line");
      ctx.beginPath();
      ctx.moveTo(0, rr * CELL + 0.5);
      ctx.lineTo(w, rr * CELL + 0.5);
      ctx.stroke();
    }

    // placed enemies - each drawn as its real in-game glyph (see GLYPHS) on a
    // hue-tinted backing square, the icon itself sized to its real footprint:
    // Enemy3's 8x8 BG tile fills the cell as before, everything else is a
    // 16x16 sprite and is drawn noticeably larger (and centered, so it
    // overflows into the cell's margin) to reflect that it's twice the size.
    placements.forEach(function (p) {
      var t = TYPE_BY_ID[p.type];
      if (!t) return;
      var glyph = GLYPHS[t.glyph];
      var x = p.tick * CELL, y = p.row * CELL;
      ctx.fillStyle = tok(t.hue);
      var pad = 2;
      roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
      var big = glyph.size === 16;
      var box = big ? CELL * 1.55 : CELL - 6;
      var bx = x + CELL / 2 - box / 2, by = y + CELL / 2 - box / 2;
      var iconPad = box * 0.08;
      drawGlyph(ctx, glyph, bx + iconPad, by + iconPad, box - iconPad * 2, box - iconPad * 2);
    });

    // Each enemy3_wave cell's own offset (cells, 8px each - see
    // ENEMY3_CENTERX_TABLE in the ASM), tappable via enemy3OffsetHitTest
    // below. Per-placement, not derived/shared - drawn last so it's never
    // covered by another cell.
    ctx.font = "700 " + Math.max(8, Math.round(CELL * 0.36)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    placements.forEach(function (p) {
      if (p.type !== "enemy3_wave") return;
      var x = p.tick * CELL, y = p.row * CELL;
      var labelH = enemy3OffsetLabelH();
      ctx.strokeStyle = tok("--line");
      ctx.lineWidth = 1;
      roundRect(ctx, x + 1.5, y - labelH + 1.5, CELL - 3, labelH - 3, 3);
      ctx.stroke();
      ctx.fillStyle = tok("--ink");
      ctx.fillText("+" + (p.offset || 0), x + CELL / 2, y - 1);
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- interaction ----------
  function cellFromEvent(ev) {
    var rect = grid.getBoundingClientRect();
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    var col = Math.floor(x / CELL);
    var row = Math.floor(y / CELL);
    if (col < 0 || col >= MAX_TICK || row < 0 || row >= ROWS) return null;
    return { tick: col, row: row };
  }

  // Hit zone for an enemy3_wave cell's own "+N" offset label - the strip
  // of canvas directly above the cell's own top edge, not overlapping the
  // cell itself (which keeps its normal place/erase click behavior).
  function enemy3OffsetLabelH() { return Math.max(14, Math.round(CELL * 0.6)); }

  function enemy3OffsetHitTest(x, y) {
    var labelH = enemy3OffsetLabelH();
    for (var pi = 0; pi < placements.length; pi++) {
      var p = placements[pi];
      if (p.type !== "enemy3_wave") continue;
      var cx = p.tick * CELL, cy = p.row * CELL;
      if (x >= cx && x < cx + CELL && y >= cy - labelH && y < cy) return pi;
    }
    return null;
  }

  var offsetOverlay = document.getElementById("offsetOverlay");
  var offsetInput = document.getElementById("offsetInput");
  var offsetStatus = document.getElementById("offsetStatus");
  var offsetEditPlacementIdx = null;

  function openOffsetEditor(pi) {
    offsetEditPlacementIdx = pi;
    document.getElementById("offsetOverlayTitle").textContent = "Offset (cells, 8px each) — tick " + placements[pi].tick;
    offsetInput.value = placements[pi].offset || 0;
    offsetStatus.textContent = "";
    offsetStatus.classList.remove("ok");
    offsetOverlay.classList.add("show");
    offsetInput.focus();
    offsetInput.select();
  }

  function saveOffsetEditor() {
    var v = parseInt(offsetInput.value, 10);
    if (!Number.isFinite(v) || v < 0) {
      offsetStatus.textContent = "enter a whole number, 0 or more";
      offsetStatus.classList.remove("ok");
      return;
    }
    pushHistory();
    placements[offsetEditPlacementIdx].offset = v;
    offsetOverlay.classList.remove("show");
    render();
    flash("offset set to +" + v);
  }

  document.getElementById("btnOffsetCancel").addEventListener("click", function () {
    offsetOverlay.classList.remove("show");
  });
  document.getElementById("btnOffsetSave").addEventListener("click", saveOffsetEditor);
  offsetInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") saveOffsetEditor();
    if (ev.key === "Escape") offsetOverlay.classList.remove("show");
  });
  offsetOverlay.addEventListener("click", function (ev) {
    if (ev.target === offsetOverlay) offsetOverlay.classList.remove("show");
  });

  grid.addEventListener("click", function (ev) {
    var rect = grid.getBoundingClientRect();
    var offsetHit = enemy3OffsetHitTest(ev.clientX - rect.left, ev.clientY - rect.top);
    if (offsetHit !== null) {
      openOffsetEditor(offsetHit);
      return;
    }
    var c = cellFromEvent(ev);
    if (!c) return;
    if (eraseArmed) {
      pushHistory();
      setCell(c.tick, c.row, null);
      flash("erased tick " + c.tick + ", row " + c.row);
    } else if (armedType) {
      pushHistory();
      setCell(c.tick, c.row, armedType);
      flash(TYPE_BY_ID[armedType].name + " → tick " + c.tick + ", row " + c.row);
    } else {
      flash("pick an enemy on the right first");
      return;
    }
    render();
  });

  // keep the ruler in sync with the scrollable grid (this is the "swipe" pan)
  canvasScroll.addEventListener("scroll", function () {
    rulerScroll.scrollLeft = canvasScroll.scrollLeft;
  }, { passive: true });

  document.getElementById("btnPrev").addEventListener("click", function () {
    canvasScroll.scrollBy({ left: -32 * CELL, behavior: "smooth" });
  });
  document.getElementById("btnNext").addEventListener("click", function () {
    canvasScroll.scrollBy({ left: 32 * CELL, behavior: "smooth" });
  });

  // ---------- save / load ----------
  function currentJSON() {
    return JSON.stringify({
      version: 1,
      game: "CYBER_SUZUKA",
      maxTick: MAX_TICK,
      placements: placements.slice().sort(function (a, b) { return a.tick - b.tick || a.row - b.row; })
    }, null, 2);
  }

  document.getElementById("btnSave").addEventListener("click", function () {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "cyber_suzuka_schedule.json", data: currentJSON() }).then(
        function () { flash("saved cyber_suzuka_schedule.json"); },
        function (err) {
          if (err && err.code === "declined") { flash("save cancelled"); return; }
          flash("save unavailable here — use Copy JSON instead");
        }
      );
      return;
    }
    // no downloads capability in this view - Blob/anchor downloads are
    // commonly blocked in a sandboxed artifact frame, so don't pretend
    // it worked. Copy JSON (clipboard) is the reliable path instead.
    flash("save unavailable here — use Copy JSON instead");
  });

  // Returns a status message rather than showing it - callers decide
  // where that's safe to display.
  function importJSONText(text) {
    var data = JSON.parse(text);
    if (!Array.isArray(data.placements)) throw new Error("no placements array");
    var valid = data.placements.filter(function (p) {
      return TYPE_BY_ID[p.type] && Number.isInteger(p.tick) && Number.isInteger(p.row);
    });
    pushHistory();
    placements = valid;
    render();
    var skipped = data.placements.length - valid.length;
    return "loaded " + valid.length + " placements" + (skipped ? " (" + skipped + " skipped - bad type/tick/row)" : "");
  }

  document.getElementById("fileInput").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { flash(importJSONText(reader.result)); }
      catch (e) { flash("could not read that file: " + e.message); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  // ---------- misc UI ----------
  var liveMsg = document.getElementById("liveMsg");
  var flashTimer = null;
  function flash(msg) {
    liveMsg.textContent = msg;
    liveMsg.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { liveMsg.classList.remove("show"); }, 1800);
  }

  function render() {
    var gctx = grid.getContext("2d");
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawGrid(gctx, MAX_TICK * CELL, ROWS * CELL);
  }

  // ---------- boot ----------
  layout();
  render();
  window.addEventListener("resize", function () { layout(); render(); });
})();
</script>
</body>
