<title>CYBER_SUZUKA — Spawn Schedule Editor</title>
<style>
  :root {
    --bg: #05080d;
    --surface: #0b1220;
    --surface-2: #0e1626;
    --line: #17233a;
    --grid-line: #1a2f52;
    --grid-line-strong: #2c58a0;
    --ink: #eaf1fb;
    --ink-dim: #7f93ad;
    --ink-faint: #4c5f7d;
    --accent: #4fd2ff;
    --accent-ink: #04141c;
    --danger: #ff5d6c;
    --danger-ink: #260607;
    --ok: #6bdc7c;

    --hue-simple: #b98cff;
    --hue-e2a: #ff8fc6;
    --hue-e2b: #ff5f9e;
    --hue-e3: #38d9c4;
    --hue-e4: #ffa94d;
    --hue-e5: #6bdc7c;
    --hue-boss: #ff5d5d;

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: row;
    height: 100vh;
  }

  button, .btn-label {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 7px 8px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  /* .btn-label wraps the hidden file input directly (native label-for
     file-picker trigger) instead of a button that proxies a JS .click()
     onto it - synthetic clicks on file inputs are unreliable inside a
     sandboxed frame, this isn't. */
  .btn-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  button:hover, .btn-label:hover { border-color: var(--ink-faint); }
  button:active, .btn-label:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger-btn { background: var(--surface-2); color: var(--danger); border-color: #4a2226; }
  button.danger-btn.armed { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }

  /* ---------- grid area (left, fills remaining space) ---------- */
  .gridwrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
  }

  .ruler-row {
    display: flex;
    flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .gutter-corner {
    flex: 0 0 var(--gutter-w);
    background: var(--surface);
  }
  .ruler-scroll {
    overflow: hidden;
    flex: 1 1 auto;
  }
  #ruler {
    display: block;
  }

  .grid-row {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  .row-gutter-scroll {
    overflow: hidden;
    flex: 0 0 var(--gutter-w);
  }
  #rowGutter { display: block; }

  .canvas-scroll {
    flex: 1 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    touch-action: pan-x;
  }
  #grid {
    display: block;
    cursor: crosshair;
  }

  /* ---------- right sidebar: identity, stats, actions, palette ---------- */
  /* Kept deliberately thin - the grid is the workspace, the sidebar is */
  /* just controls. Palette entries are small color chips (number+code, */
  /* the same glyph the grid itself draws for a placement) rather than  */
  /* name+description cards, so 13 enemy types cost a few rows, not a   */
  /* scroll-hogging list. Full names live in the title attr + the       */
  /* one-line "armed" readout, not baked into every chip.               */
  aside {
    flex: 0 0 196px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .side-title {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .side-title .name {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .side-title .sub {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  .side-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .side-actions button, .side-actions .btn-label { width: 100%; padding: 6px 6px; font-size: 11px; }
  .side-actions .full { grid-column: 1 / -1; }

  .palette {
    overflow-y: auto;
    padding: 5px 8px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
    min-height: 0;
  }
  .pitem {
    width: 33px;
    height: 30px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border-radius: 5px;
    border: 2px solid transparent;
    cursor: pointer;
    color: #05080d;
    font-family: var(--font-mono);
    padding: 0;
  }
  .pitem:hover { filter: brightness(1.08); }
  .pitem.armed {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .pitem .pnum {
    font-size: 6px;
    font-weight: 600;
    opacity: 0.6;
    font-variant-numeric: tabular-nums;
  }
  .pitem .pshort {
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  #liveMsg {
    position: fixed;
    left: calc(50% - 118px);
    bottom: 22px;
    transform: translate(-50%, 8px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
    max-width: min(70vw, 480px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #liveMsg.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 8, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    width: min(560px, 100%);
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .overlay-title { font-size: 13px; font-weight: 600; }
  #pasteText {
    flex: 1 1 auto;
    min-height: 220px;
    resize: vertical;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.4;
  }
  .overlay-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .overlay-actions button { padding: 8px 14px; }
  /* Inline, not the bottom-fixed toast - on mobile a toast at the
     screen edge can end up hidden behind the on-screen keyboard right
     after typing/pasting into the textarea above, making a real error
     silently invisible. This sits in the card itself instead. */
  .overlay-status {
    font-size: 11.5px;
    color: var(--danger);
    min-height: 1.2em;
  }
  .overlay-status.ok { color: var(--ok); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- narrow viewports (phone, or a narrow browser pane): ---------- */
  /* the grid is the whole point, so it stays full-width and on top; the    */
  /* sidebar drops below as a short, capped-height strip instead of eating  */
  /* most of the screen's width down a 236px column.                       */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .gridwrap { height: auto; flex: 1 1 auto; min-height: 0; }
    aside {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      max-height: 42vh;
      border-left: none;
      border-top: 1px solid var(--line);
    }
    .side-title { display: none; }
    .side-actions { grid-template-columns: repeat(4, 1fr); padding: 6px 10px; }
    .side-actions .full { grid-column: auto; }
  }
</style>

<body>
  <div class="gridwrap">
    <div class="ruler-row">
      <div class="gutter-corner"></div>
      <div class="ruler-scroll"><canvas id="ruler"></canvas></div>
    </div>
    <div class="grid-row">
      <div class="row-gutter-scroll"><canvas id="rowGutter"></canvas></div>
      <div class="canvas-scroll" id="canvasScroll">
        <canvas id="grid"></canvas>
      </div>
    </div>
  </div>

  <aside>
    <div class="side-title">
      <div class="name">CYBER_SUZUKA</div>
      <div class="sub">spawn schedule editor</div>
    </div>

    <div class="side-actions">
      <button id="btnPrev" title="Scroll back one screen (32 ticks)">◀ screen</button>
      <button id="btnNext" title="Scroll forward one screen (32 ticks)">screen ▶</button>
      <button class="danger-btn full" id="btnErase">Erase</button>
      <button class="primary" id="btnSave">Save JSON</button>
      <button id="btnCopy">Copy JSON</button>
      <label class="btn-label" for="fileInput">Load file</label>
      <button id="btnPaste">Paste JSON</button>
      <button class="full" id="btnClear">Clear all</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>

    <div class="palette" id="palette"></div>
  </aside>

  <div id="liveMsg"></div>

  <div id="clearOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-title" id="clearOverlayTitle">Clear all placements?</div>
      <div class="overlay-actions">
        <button id="btnClearCancel">Cancel</button>
        <button class="danger-btn" id="btnClearConfirm">Clear all</button>
      </div>
    </div>
  </div>

  <div id="pasteOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-title">Paste schedule JSON</div>
      <textarea id="pasteText" placeholder="paste the exported {&quot;placements&quot;: [...]} JSON here"></textarea>
      <div class="overlay-status" id="pasteStatus"></div>
      <div class="overlay-actions">
        <button id="btnPasteCancel">Cancel</button>
        <button class="primary" id="btnPasteImport">Import</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- enemy palette (matches the current CYBER_GD_BOSS.asm schedule) ----------
  var TYPES = [
    { id: "simple",     num: 1,  short: "SIMP",name: "Simple (Enemy1)",  desc: "any row - dodge dir is decided from player Y at center", hue: "--hue-simple", defaultRow: 2  },
    { id: "e2a_top",    num: 2,  short: "2AT", name: "Enemy2A — Top",    desc: "SPAWN_E2_TOP_A",   hue: "--hue-e2a",    defaultRow: 4  },
    { id: "e2a_bot",    num: 3,  short: "2AB", name: "Enemy2A — Bottom", desc: "SPAWN_E2_BOT_A",   hue: "--hue-e2a",    defaultRow: 12 },
    { id: "e2b_top",    num: 4,  short: "2BT", name: "Enemy2B — Top",    desc: "SPAWN_E2_TOP_B",   hue: "--hue-e2b",    defaultRow: 6  },
    { id: "e2b_bot",    num: 5,  short: "2BB", name: "Enemy2B — Bottom", desc: "SPAWN_E2_BOT_B",   hue: "--hue-e2b",    defaultRow: 14 },
    { id: "enemy3_wave",num: 6,  short: "E3",  name: "Enemy3 — Wave",    desc: "SPAWN_E3_WAVE (budget 32)", hue: "--hue-e3", defaultRow: 1  },
    { id: "enemy4_y16", num: 7,  short: "4-16",name: "Enemy4 — Top",     desc: "baseY 32",         hue: "--hue-e4",     defaultRow: 4  },
    { id: "enemy4_y32", num: 8,  short: "4-32",name: "Enemy4 — Mid",     desc: "baseY 64",         hue: "--hue-e4",     defaultRow: 8  },
    { id: "enemy4_y48", num: 9,  short: "4-48",name: "Enemy4 — Bottom",  desc: "baseY 72",         hue: "--hue-e4",     defaultRow: 9  },
    { id: "enemy5_y16", num: 10, short: "5-16",name: "Enemy5 — Top",     desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 4  },
    { id: "enemy5_y32", num: 11, short: "5-32",name: "Enemy5 — Mid",     desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 8  },
    { id: "enemy5_y48", num: 12, short: "5-48",name: "Enemy5 — Bottom",  desc: "TYPE_ENEMY1_LOOK", hue: "--hue-e5",     defaultRow: 9  },
    { id: "boss",       num: 13, short: "BOSS",name: "Boss",             desc: "BOSS_SPAWN",       hue: "--hue-boss",   defaultRow: 20 }
  ];
  var TYPE_BY_ID = {};
  TYPES.forEach(function (t) { TYPE_BY_ID[t.id] = t; });

  // ---------- Enemy3 wave internals (ENEMY3_TRY_SPAWN in CYBER_GD_BOSS.asm) -
  // kept in sync by hand with the ASM constants of the same name, used only
  // to draw the one-set spawn preview in drawGrid(). SPAWN_E3_WAVE arms a
  // budget of 32 (ENEMY3_BUDGET), which just repeats this same 3-member set
  // shape until it runs out - the grid previews one set, not all ~11.
  var ENEMY3_OFFSET_TABLE_PX = [0, 16, 32]; // mirrors ENEMY3_OFFSET_TABLE (px)
  var ENEMY3_OFFSET_COUNT = ENEMY3_OFFSET_TABLE_PX.length;
  // Real in-game spacing is 1 GAME_TICK/spawn (ENEMY3_SPAWN_INTERVAL=8 frames);
  // 1 blank cell between each previewed member is a display-only choice for
  // legibility and doesn't change ENEMY3_SPAWN_INTERVAL in the actual game.
  var ENEMY3_PREVIEW_TICK_GAP = 2;

  // ---------- geometry ----------
  var ROWS = 24;
  var MAX_TICK = 400; // scrollable canvas width in cells; game currently uses up to ~270
  var GUTTER_W = 30;
  var RULER_H = 22;
  var CELL = 26; // recomputed in layout() so all 24 rows always fit vertically
  document.documentElement.style.setProperty("--gutter-w", GUTTER_W + "px");

  var css = getComputedStyle(document.documentElement);
  function tok(name) { return css.getPropertyValue(name).trim(); }

  // ---------- state ----------
  var placements = []; // {tick, row, type}
  var armedType = null;
  var eraseArmed = false;

  function placementAt(tick, row) {
    for (var i = 0; i < placements.length; i++) {
      if (placements[i].tick === tick && placements[i].row === row) return i;
    }
    return -1;
  }

  function setCell(tick, row, typeId) {
    var idx = placementAt(tick, row);
    if (idx >= 0) placements.splice(idx, 1);
    if (typeId) placements.push({ tick: tick, row: row, type: typeId });
    placements.sort(function (a, b) { return a.tick - b.tick || a.row - b.row; });
  }

  // ---------- palette UI ----------
  var paletteEl = document.getElementById("palette");
  TYPES.forEach(function (t) {
    var item = document.createElement("button");
    item.className = "pitem";
    item.dataset.type = t.id;
    item.style.background = "var(" + t.hue + ")";
    item.title = t.name + " — " + t.desc;
    item.innerHTML =
      '<span class="pnum">' + String(t.num).padStart(2, "0") + '</span>' +
      '<span class="pshort">' + t.short + '</span>';
    item.addEventListener("click", function () {
      eraseArmed = false;
      document.getElementById("btnErase").classList.remove("armed");
      armedType = armedType === t.id ? null : t.id;
      refreshPaletteArmed();
    });
    paletteEl.appendChild(item);
  });

  function refreshPaletteArmed() {
    Array.prototype.forEach.call(paletteEl.children, function (el) {
      el.classList.toggle("armed", el.dataset.type === armedType);
    });
  }

  document.getElementById("btnErase").addEventListener("click", function () {
    armedType = null;
    eraseArmed = !eraseArmed;
    this.classList.toggle("armed", eraseArmed);
    refreshPaletteArmed();
  });

  // ---------- canvases ----------
  var ruler = document.getElementById("ruler");
  var rowGutter = document.getElementById("rowGutter");
  var grid = document.getElementById("grid");
  var canvasScroll = document.getElementById("canvasScroll");
  var rulerScroll = document.querySelector(".ruler-scroll");
  var gridwrap = document.querySelector(".gridwrap");

  var DPR = Math.max(1, window.devicePixelRatio || 1);

  function sizeCanvas(cv, wCss, hCss) {
    cv.width = Math.round(wCss * DPR);
    cv.height = Math.round(hCss * DPR);
    cv.style.width = wCss + "px";
    cv.style.height = hCss + "px";
    var ctx = cv.getContext("2d");
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    return ctx;
  }

  function layout() {
    // all 24 rows must fit in the vertical space left after the ruler - compute
    // the cell size from the available height instead of a fixed pixel value.
    var availH = gridwrap.clientHeight - RULER_H;
    CELL = Math.max(14, Math.min(30, Math.floor(availH / ROWS)));

    var gridW = MAX_TICK * CELL;
    var gridH = ROWS * CELL;

    var gctx = sizeCanvas(grid, gridW, gridH);
    var rctx = sizeCanvas(ruler, gridW, RULER_H);
    var rgctx = sizeCanvas(rowGutter, GUTTER_W, gridH);

    drawRuler(rctx, gridW, RULER_H);
    drawRowGutter(rgctx, GUTTER_W, gridH);
    drawGrid(gctx, gridW, gridH);
  }

  function drawRuler(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textBaseline = "middle";
    for (var t = 0; t <= MAX_TICK; t += 1) {
      var x = t * CELL;
      var strong = t % 32 === 0;
      ctx.strokeStyle = strong ? tok("--grid-line-strong") : tok("--grid-line");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, h - (strong ? 10 : 5));
      ctx.lineTo(x + 0.5, h);
      ctx.stroke();
      if (t % 32 === 0) {
        ctx.fillStyle = tok("--ink");
        ctx.fillText(String(t), x + 3, h - 13);
      }
    }
    ctx.strokeStyle = tok("--line");
    ctx.beginPath();
    ctx.moveTo(0, h - 0.5);
    ctx.lineTo(w, h - 0.5);
    ctx.stroke();
  }

  function drawRowGutter(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (var r = 0; r < ROWS; r++) {
      var y = r * CELL;
      ctx.fillStyle = tok("--ink-dim");
      ctx.fillText(String(r), w - 7, y + CELL / 2);
      ctx.strokeStyle = tok("--grid-line");
      ctx.beginPath();
      ctx.moveTo(w - 5, y + 0.5);
      ctx.lineTo(w, y + 0.5);
      ctx.stroke();
    }
    ctx.textAlign = "left";
  }

  function drawGrid(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--bg");
    ctx.fillRect(0, 0, w, h);

    // 8px-equivalent cell grid, in blue, per spec
    for (var c = 0; c <= MAX_TICK; c++) {
      var strong = c % 32 === 0;
      ctx.strokeStyle = strong ? tok("--grid-line-strong") : tok("--grid-line");
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(c * CELL + 0.5, 0);
      ctx.lineTo(c * CELL + 0.5, h);
      ctx.stroke();
    }
    for (var rr = 0; rr <= ROWS; rr++) {
      ctx.strokeStyle = tok("--grid-line");
      ctx.beginPath();
      ctx.moveTo(0, rr * CELL + 0.5);
      ctx.lineTo(w, rr * CELL + 0.5);
      ctx.stroke();
    }

    // enemy3_wave preview: one set = ENEMY3_OFFSET_COUNT identical "E3"
    // icons, ENEMY3_PREVIEW_TICK_GAP ticks apart, each with its own
    // ENEMY3_OFFSET_TABLE_PX value labeled above it ("+0", "+2", "+4", ...).
    // Index 0 is the real trigger (drawn by the placed-enemies pass below,
    // just labeled here); index 1+ are non-editable preview cells - not
    // part of `placements`, never saved, never clickable. The budget-32
    // wave just repeats this same set shape until it runs out; the grid
    // previews one set, not all ~11 repeats.
    placements.forEach(function (p) {
      if (p.type !== "enemy3_wave") return;
      var hue = tok(TYPE_BY_ID[p.type].hue);
      ENEMY3_OFFSET_TABLE_PX.forEach(function (px, i) {
        var t = p.tick + i * ENEMY3_PREVIEW_TICK_GAP;
        if (t > MAX_TICK) return;
        var x = t * CELL, y = p.row * CELL;
        if (i > 0) {
          var pad2 = 2;
          ctx.fillStyle = hue;
          roundRect(ctx, x + pad2, y + pad2, CELL - pad2 * 2, CELL - pad2 * 2, 4);
          ctx.fill();
          ctx.fillStyle = "#05080d";
          ctx.font = "700 " + Math.max(8, Math.round(CELL * 0.36)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("E3", x + CELL / 2, y + CELL / 2 + 1);
        }
        ctx.fillStyle = tok("--ink-dim");
        ctx.font = "600 " + Math.max(6, Math.round(CELL * 0.26)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("+" + (px / 8), x + CELL / 2, y - 1);
      });
    });

    // placed enemies
    ctx.font = "700 " + Math.max(8, Math.round(CELL * 0.36)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    placements.forEach(function (p) {
      var t = TYPE_BY_ID[p.type];
      if (!t) return;
      var x = p.tick * CELL, y = p.row * CELL;
      ctx.fillStyle = tok(t.hue);
      var pad = 2;
      roundRect(ctx, x + pad, y + pad, CELL - pad * 2, CELL - pad * 2, 4);
      ctx.fill();
      ctx.fillStyle = "#05080d";
      ctx.fillText(t.short, x + CELL / 2, y + CELL / 2 + 1);
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- interaction ----------
  function cellFromEvent(ev) {
    var rect = grid.getBoundingClientRect();
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    var col = Math.floor(x / CELL);
    var row = Math.floor(y / CELL);
    if (col < 0 || col >= MAX_TICK || row < 0 || row >= ROWS) return null;
    return { tick: col, row: row };
  }

  grid.addEventListener("click", function (ev) {
    var c = cellFromEvent(ev);
    if (!c) return;
    if (eraseArmed) {
      setCell(c.tick, c.row, null);
      flash("erased tick " + c.tick + ", row " + c.row);
    } else if (armedType) {
      setCell(c.tick, c.row, armedType);
      flash(TYPE_BY_ID[armedType].name + " → tick " + c.tick + ", row " + c.row);
    } else {
      flash("pick an enemy on the right first");
      return;
    }
    render();
  });

  // keep the ruler in sync with the scrollable grid (this is the "swipe" pan)
  canvasScroll.addEventListener("scroll", function () {
    rulerScroll.scrollLeft = canvasScroll.scrollLeft;
  }, { passive: true });

  document.getElementById("btnPrev").addEventListener("click", function () {
    canvasScroll.scrollBy({ left: -32 * CELL, behavior: "smooth" });
  });
  document.getElementById("btnNext").addEventListener("click", function () {
    canvasScroll.scrollBy({ left: 32 * CELL, behavior: "smooth" });
  });

  // ---------- save / load ----------
  function currentJSON() {
    return JSON.stringify({
      version: 1,
      game: "CYBER_SUZUKA",
      maxTick: MAX_TICK,
      placements: placements.slice().sort(function (a, b) { return a.tick - b.tick || a.row - b.row; })
    }, null, 2);
  }

  document.getElementById("btnSave").addEventListener("click", function () {
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: "cyber_suzuka_schedule.json", data: currentJSON() }).then(
        function () { flash("saved cyber_suzuka_schedule.json"); },
        function (err) {
          if (err && err.code === "declined") { flash("save cancelled"); return; }
          flash("save unavailable here — use Copy JSON instead");
        }
      );
      return;
    }
    // no downloads capability in this view - Blob/anchor downloads are
    // commonly blocked in a sandboxed artifact frame, so don't pretend
    // it worked. Copy JSON (clipboard) is the reliable path instead.
    flash("save unavailable here — use Copy JSON instead");
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    var text = currentJSON();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        flash("JSON copied — paste it into the chat to import");
      }, function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flash("JSON copied — paste it into the chat to import"); }
    catch (e) { flash("copy failed — use Save instead"); }
    ta.remove();
  }

  // shared by both "Load file" (FileReader) and "Paste JSON" (textarea) -
  // same JSON shape either way, just a different source for the text.
  // Returns a status message rather than showing it - callers decide
  // where that's safe to display (see the paste overlay's inline
  // status, which doesn't rely on the bottom toast).
  function importJSONText(text) {
    var data = JSON.parse(text);
    if (!Array.isArray(data.placements)) throw new Error("no placements array");
    var valid = data.placements.filter(function (p) {
      return TYPE_BY_ID[p.type] && Number.isInteger(p.tick) && Number.isInteger(p.row);
    });
    placements = valid;
    render();
    var skipped = data.placements.length - valid.length;
    return "loaded " + valid.length + " placements" + (skipped ? " (" + skipped + " skipped - bad type/tick/row)" : "");
  }

  document.getElementById("fileInput").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { flash(importJSONText(reader.result)); }
      catch (e) { flash("could not read that file: " + e.message); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  var pasteOverlay = document.getElementById("pasteOverlay");
  var pasteText = document.getElementById("pasteText");
  var pasteStatus = document.getElementById("pasteStatus");
  document.getElementById("btnPaste").addEventListener("click", function () {
    pasteText.value = "";
    pasteStatus.textContent = "";
    pasteStatus.classList.remove("ok");
    pasteOverlay.classList.add("show");
    pasteText.focus();
  });
  document.getElementById("btnPasteCancel").addEventListener("click", function () {
    pasteOverlay.classList.remove("show");
  });
  document.getElementById("btnPasteImport").addEventListener("click", function () {
    if (!pasteText.value.trim()) {
      pasteStatus.textContent = "paste some JSON first";
      pasteStatus.classList.remove("ok");
      return;
    }
    try {
      var msg = importJSONText(pasteText.value);
      pasteStatus.textContent = msg;
      pasteStatus.classList.add("ok");
      flash(msg);
      pasteOverlay.classList.remove("show");
    } catch (e) {
      pasteStatus.textContent = "could not read that JSON: " + e.message;
      pasteStatus.classList.remove("ok");
    }
  });
  pasteOverlay.addEventListener("click", function (ev) {
    if (ev.target === pasteOverlay) pasteOverlay.classList.remove("show");
  });

  // window.confirm() is blocked (silently declines) inside the sandboxed
  // artifact frame, which made the old confirm()-guarded Clear button a
  // permanent no-op - this overlay replaces it with an in-page confirm
  // that doesn't depend on a native dialog.
  var clearOverlay = document.getElementById("clearOverlay");
  document.getElementById("btnClear").addEventListener("click", function () {
    if (!placements.length) { flash("nothing to clear"); return; }
    document.getElementById("clearOverlayTitle").textContent = "Clear all " + placements.length + " placements?";
    clearOverlay.classList.add("show");
  });
  document.getElementById("btnClearCancel").addEventListener("click", function () {
    clearOverlay.classList.remove("show");
  });
  document.getElementById("btnClearConfirm").addEventListener("click", function () {
    placements = [];
    render();
    clearOverlay.classList.remove("show");
    flash("cleared");
  });
  clearOverlay.addEventListener("click", function (ev) {
    if (ev.target === clearOverlay) clearOverlay.classList.remove("show");
  });

  // ---------- misc UI ----------
  var liveMsg = document.getElementById("liveMsg");
  var flashTimer = null;
  function flash(msg) {
    liveMsg.textContent = msg;
    liveMsg.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { liveMsg.classList.remove("show"); }, 1800);
  }

  function render() {
    var gctx = grid.getContext("2d");
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawGrid(gctx, MAX_TICK * CELL, ROWS * CELL);
  }

  // ---------- boot ----------
  layout();
  render();
  window.addEventListener("resize", function () { layout(); render(); });
})();
</script>
</body>
