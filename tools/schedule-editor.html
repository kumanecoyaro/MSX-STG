    var gridH = ROWS * CELL;

    // The spacer establishes #canvasScroll's scrollable width (the full
    // timeline) - #grid itself (sticky-positioned, see its CSS) is only
    // ever sized to the visible viewport, redrawn on scroll instead of
    // pre-rendering the whole thing. See drawGrid's scrollX comment.
    gridSpacer.style.width = gridW + "px";
    console.log("layout:", {MAX_TICK, CELL, gridW, "gridSpacer.style.width": gridSpacer.style.width});
    var viewW = canvasScroll.clientWidth || gridW;
    var gctx = sizeCanvas(grid, viewW, gridH);
    var rctx = sizeCanvas(ruler, viewW, RULER_H);
    var rgctx = sizeCanvas(rowGutter, GUTTER_W, gridH);

    drawRuler(rctx, viewW, RULER_H, canvasScroll.scrollLeft);
    drawRowGutter(rgctx, GUTTER_W, gridH);
    drawGrid(gctx, viewW, gridH, undefined, canvasScroll.scrollLeft);
  }

  function drawRuler(ctx, w, h, scrollX) {
    scrollX = scrollX || 0;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textBaseline = "middle";
    // One stroke() call per tick color instead of ~400 - a separate
    // beginPath/stroke per tick mark was most of this function's cost.
    var regular = new Path2D(), strong = new Path2D();
    ctx.fillStyle = tok("--ink");
    var firstTick = Math.floor(scrollX / CELL);
    var lastTick = Math.ceil((scrollX + w) / CELL) + 1;
    for (var t = firstTick; t <= lastTick && t <= MAX_TICK; t += 1) {
      var x = t * CELL - scrollX + 0.5;
      var isStrong = t % 32 === 0;
      var p = isStrong ? strong : regular;
      p.moveTo(x, h - (isStrong ? 10 : 5));
      p.lineTo(x, h);
      if (isStrong) ctx.fillText(String(t), x + 2.5, h - 13);
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = tok("--grid-line");
    ctx.stroke(regular);
    ctx.strokeStyle = tok("--grid-line-strong");
    ctx.stroke(strong);
    ctx.strokeStyle = tok("--line");
    ctx.beginPath();
    ctx.moveTo(0, h - 0.5);
    ctx.lineTo(w, h - 0.5);
    ctx.stroke();
  }

  function drawRowGutter(ctx, w, h) {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--surface");
    ctx.fillRect(0, 0, w, h);
    ctx.font = "9.5px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = tok("--ink-dim");
    var ticks = new Path2D();
    for (var r = 0; r < ROWS; r++) {
      var y = r * CELL;
      ctx.fillText(String(r), w - 7, y + CELL / 2);
      ticks.moveTo(w - 5, y + 0.5);
      ticks.lineTo(w, y + 0.5);
    }
    ctx.strokeStyle = tok("--grid-line");
    ctx.stroke(ticks);
    ctx.textAlign = "left";
  }

  // skipIdx: index into placements to leave undrawn - used while that one
  // placement is being hold-move-dragged on the separate #dragOverlay (see
  // beginDragOverlay), so the full grid isn't left showing it twice (once
  // at its old spot here, once at its live spot on the overlay).
  //
  // scrollX: #grid is now sized to just the visible viewport (see layout())
  // instead of the whole MAX_TICK-tick timeline - a full-timeline canvas
  // measured ~281ms per redraw on a real device (against 0.8ms here),
  // which was the actual cause of place/erase/drag all feeling laggy on
  // that device, batched strokes and cached glyphs notwithstanding: the
  // clearRect/fillRect/stroke area itself was the cost, not the call count.
  // w/h here are the small viewport dimensions; everything is drawn at
  // (world position - scrollX) and only ticks that actually fall in view
  // are visited at all.
  function drawGrid(ctx, w, h, skipIdx, scrollX) {
    scrollX = scrollX || 0;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = tok("--bg");
    ctx.fillRect(0, 0, w, h);

    var firstTick = Math.max(0, Math.floor(scrollX / CELL) - 1);
    var lastTick = Math.min(MAX_TICK, Math.ceil((scrollX + w) / CELL) + 1);

    // round36 ("地形もエディット対象に"): Stage2's own terrain profile,
    // drawn as a simple color-block skyline in rows 20-23 - a placeholder
    // representation (real rock/sand tile art, not attempted here) same
    // spirit as drawS2BossPlaceholder's own plain rectangle. Drawn UNDER
    // the grid lines/placement icons (before they're drawn below) so it
    // reads as background, not on top of anything. tierFromRow/
    // terrainColAt's own comments explain the row<->tier mapping and the
    // tick<->terrain-column relationship (they're the same axis, modulo
    // terrainLen once the track loops - exactly matching how GAME_TICK
    // and the real terrain's own scroll index advance in lockstep).
    if (STAGE === 2) {
      var rockFill = tok("--terrain-rock") || "#8b5a2b";
      var skyFill = tok("--terrain-sky") || "rgba(139,90,43,0.12)";
      for (var tt = firstTick; tt <= lastTick; tt++) {
        var tier = terrain2[terrainColAt(tt)];
        var solidFromRow = 23 - tier; // row(s) below this, inclusive, are ground
        var tx = tt * CELL - scrollX;
        ctx.fillStyle = skyFill;
        ctx.fillRect(tx, 20 * CELL, CELL, (solidFromRow - 20) * CELL);
        ctx.fillStyle = rockFill;
        ctx.fillRect(tx, solidFromRow * CELL, CELL, (24 - solidFromRow) * CELL);
      }
    }

    // 8px-equivalent cell grid, in blue, per spec. One stroke() call per
    // line color instead of one per line - each stroke() has real fixed
    // overhead regardless of line length, and this ran on every render().
    var regular = new Path2D(), strong = new Path2D();
    for (var c = firstTick; c <= lastTick; c++) {
      var p = (c % 32 === 0) ? strong : regular;
      var x = c * CELL - scrollX + 0.5;
      p.moveTo(x, 0);
      p.lineTo(x, h);
    }
    for (var rr = 0; rr <= ROWS; rr++) {
      var y = rr * CELL + 0.5;
      regular.moveTo(0, y);
      regular.lineTo(w, y);
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = tok("--grid-line");
    ctx.stroke(regular);
    ctx.strokeStyle = tok("--grid-line-strong");
    ctx.stroke(strong);

    // placed enemies - each drawn as its real in-game glyph (see GLYPHS), no
    // synthetic color coding, top-left anchored at (tick,row) since that's
    // the sprite/tile's real top-left origin in-game. Sized to its true
    // footprint: Enemy3's 8x8 BG tile fills exactly one cell, everything
    // else is a 16x16 sprite and fills exactly 2x2 cells. The boss is drawn
    // at its full real size (5x16 cells - see drawBossBody) instead of an
    // icon stand-in. Blitted from the offscreen caches above (getGlyphCanvas/
    // getBossCanvas) instead of redrawing bit-by-bit every time. Anything
    // whose footprint can't possibly reach the visible tick range is
    // skipped entirely - cheap since placements is usually small, but keeps
    // this from scaling with MAX_TICK on a schedule with entries scattered
    // across the whole timeline.
    placements.forEach(function (p, i) {
      if (i === skipIdx) return;
      var t = TYPE_BY_ID[p.type];
      if (!t) return;
      if (p.tick < firstTick - 6 || p.tick > lastTick) return;
      var x = p.tick * CELL - scrollX, y = p.row * CELL;
      if (p.type === "boss") {
        // The boss's real spawn position is fixed in-game - its row/tick
        // here only mark *when* it triggers, not where it appears - so
        // there's no "correct" pixel position to honor. Clamp the draw
        // origin (see bossOrigin) to stay fully on the grid instead of
        // clipping the body against the bottom/right edge when placed
        // near them.
        var bo = bossOrigin(p.tick, p.row);
        ctx.drawImage(getBossCanvas(CELL), bo.tick * CELL - scrollX, bo.row * CELL, 5 * CELL, 16 * CELL);
        return;
      }
      if (p.type === "s2_boss") {
        var bo2 = s2BossOrigin(p.tick, p.row);
        drawS2BossPlaceholder(ctx, bo2.tick * CELL - scrollX, bo2.row * CELL, CELL);
        return;
      }
      var glyph = GLYPHS[t.glyph];
      var box = CELL * (glyph.size / 8);
      ctx.drawImage(getGlyphCanvas(t.glyph, box), x, y, box, box);
    });

    // Each enemy3_wave cell's own offset (cells, 8px each - see
    // ENEMY3_CENTERX_TABLE in the ASM), tappable via enemy3OffsetHitTest
    // below. Per-placement, not derived/shared - drawn last so it's never
    // covered by another cell.
    ctx.font = "700 " + Math.max(8, Math.round(CELL * 0.36)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    placements.forEach(function (p, i) {
      if (i === skipIdx || p.type !== "enemy3_wave") return;
      if (p.tick < firstTick - 1 || p.tick > lastTick) return;
      var x = p.tick * CELL - scrollX, y = p.row * CELL;
      var labelH = enemy3OffsetLabelH();
      ctx.strokeStyle = tok("--line");
      ctx.lineWidth = 1;
      roundRect(ctx, x + 1.5, y - labelH + 1.5, CELL - 3, labelH - 3, 3);
      ctx.stroke();
      ctx.fillStyle = tok("--ink");
      ctx.fillText("+" + (p.offset || 0), x + CELL / 2, y - 1);
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- interaction ----------
  // #grid is viewport-sized and sticky-positioned (see its CSS) - its own
  // bounding rect is just the visible slice, so every screen->world
  // conversion here adds back canvasScroll.scrollLeft to land on the real
  // tick, the same way drawGrid subtracts it to place things on screen.
  function cellFromEvent(ev) {
    var rect = grid.getBoundingClientRect();
    var x = ev.clientX - rect.left + canvasScroll.scrollLeft;
    var y = ev.clientY - rect.top;
    var col = Math.floor(x / CELL);
    var row = Math.floor(y / CELL);
    if (col < 0 || col >= MAX_TICK || row < 0 || row >= ROWS) return null;
    return { tick: col, row: row };
  }

  // Hit zone for an enemy3_wave cell's own "+N" offset label - the strip
  // of canvas directly above the cell's own top edge, not overlapping the
  // cell itself (which keeps its normal place/erase click behavior).
  function enemy3OffsetLabelH() { return Math.max(14, Math.round(CELL * 0.6)); }

  function enemy3OffsetHitTest(x, y) {
    var labelH = enemy3OffsetLabelH();
    for (var pi = 0; pi < placements.length; pi++) {
      var p = placements[pi];
      if (p.type !== "enemy3_wave") continue;
      var cx = p.tick * CELL, cy = p.row * CELL;
      if (x >= cx && x < cx + CELL && y >= cy - labelH && y < cy) return pi;
    }
    return null;
  }

  var offsetOverlay = document.getElementById("offsetOverlay");
  var offsetInput = document.getElementById("offsetInput");
  var offsetStatus = document.getElementById("offsetStatus");
  var offsetEditPlacementIdx = null;

  function openOffsetEditor(pi) {
    offsetEditPlacementIdx = pi;
    document.getElementById("offsetOverlayTitle").textContent = "Offset (cells, 8px each) — tick " + placements[pi].tick;
    offsetInput.value = placements[pi].offset || 0;
    offsetStatus.textContent = "";
    offsetStatus.classList.remove("ok");
    offsetOverlay.classList.add("show");
    offsetInput.focus();
    offsetInput.select();
  }

  function saveOffsetEditor() {
    var v = parseInt(offsetInput.value, 10);
    if (!Number.isFinite(v) || v < 0) {
      offsetStatus.textContent = "enter a whole number, 0 or more";
      offsetStatus.classList.remove("ok");
      return;
    }
    pushHistory();
    placements[offsetEditPlacementIdx].offset = v;
    offsetOverlay.classList.remove("show");
    render();
    flash("offset set to +" + v);
  }

  document.getElementById("btnOffsetCancel").addEventListener("click", function () {
    offsetOverlay.classList.remove("show");
  });
  document.getElementById("btnOffsetSave").addEventListener("click", saveOffsetEditor);
  offsetInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") saveOffsetEditor();
    if (ev.key === "Escape") offsetOverlay.classList.remove("show");
  });
  offsetOverlay.addEventListener("click", function (ev) {
    if (ev.target === offsetOverlay) offsetOverlay.classList.remove("show");
  });

  // Several enemy types share the exact same icon (see GLYPHS.asterisk16's
  // comment), so the grid alone can't tell them apart - this readout shows
  // a tapped cell's real type + position, next to Load JSON. The icon is
  // its real in-game glyph (same art as the palette swatch), not a copy of
  // whatever's drawn on the grid, so it stays correct even for the boss
  // (which has no small palette icon of its own).
  var cellInfoIconEl = document.getElementById("cellInfoIcon");
  var cellInfoTextEl = document.getElementById("cellInfoText");
  var cellInfoIconCtx = cellInfoIconEl.getContext("2d");
  function showCellInfo(p) {
    var t = TYPE_BY_ID[p.type];
    if (!t) { clearCellInfo(); return; }
    cellInfoTextEl.textContent = t.name + " · tick " + p.tick + " row " + p.row;
    if (t.glyph) {
      var cssSize = 16, dpr = Math.max(1, window.devicePixelRatio || 1);
      cellInfoIconEl.width = Math.round(cssSize * dpr);
      cellInfoIconEl.height = Math.round(cssSize * dpr);
      cellInfoIconEl.style.width = cssSize + "px";
      cellInfoIconEl.style.height = cssSize + "px";
      cellInfoIconCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cellInfoIconCtx.clearRect(0, 0, cssSize, cssSize);
      var glyph = GLYPHS[t.glyph];
      var pad = glyph.size === 16 ? 0 : 3;
      drawGlyph(cellInfoIconCtx, glyph, pad, pad, cssSize - pad * 2, cssSize - pad * 2);
      cellInfoIconEl.classList.add("show");
    } else {
      cellInfoIconEl.classList.remove("show");
    }
  }
  function clearCellInfo() {
    cellInfoTextEl.textContent = "";
    cellInfoIconEl.classList.remove("show");
  }

  // Every gesture on the grid starts undecided and resolves into exactly
  // one of three things by the time it ends:
  //   - pan: moved past the jitter tolerance before the hold timer fired -
  //     scrolls the grid (driven here in JS - see #grid's touch-action:none)
  //     and does nothing else, whatever mode was armed.
  //   - holdmove: pressed on an existing placement, held still for
  //     HOLD_MS, then dragged - repositions it.
  //   - tap: released without enough movement to become a pan, and
  //     without the hold timer firing - place/erase/inspect, same as a
  //     plain click before this gesture system existed.
  // Resolving erase/place at release (not on pointerdown) is what keeps a
  // swipe that starts in erase/place mode from erasing/placing at the
  // touch-start point before the swipe is even recognized.
  var HOLD_MS = 400;
  // A real finger isn't a mouse - it wobbles a few px even when the user
  // means to hold perfectly still, and that wobble was enough to cancel
  // the hold timer and fall into "pan" instead before it ever fired. Any
  // movement that stays inside the starting cell is not a real move, so
  // tie the cancel threshold to the current cell size instead of a fixed
  // small pixel count.
  var MOVE_CANCEL = 10;
  function jitterTolerance() { return Math.max(MOVE_CANCEL, CELL); }
  // Once a hold resolves into holdmove, the placement jumps to sit this
  // many cells above wherever the finger actually is and tracks it from
  // there - on a touchscreen the finger itself covers whatever's directly
  // under it, so dragging a real finger over its own placement is unusable
  // without an offset like this.
  var HOLD_LIFT_ROWS = 3;
  var press = null; // {pointerId, startX, startY, lastX, lastY, startScrollLeft, cell, offsetHit, placementIdx, resolved, holdTimer, moved}
  // Set once per gesture when pointerup's neutral-tap branch below already
  // handled the inspect readout - lets the native-click fallback (further
  // down) skip re-running it and double-flashing on setups where pointer
  // events work fine.
  var inspectHandledByPointer = false;

  // Same idea as cellFromEvent, but for the holdmove target: the touched
  // point should land on the icon's CENTER, not its top-left anchor cell -
  // anchoring at the raw cell left the whole icon sitting down-right of
  // the finger (most icons are a 2x2-cell footprint), which read as drift
  // even though the math was doing exactly what it said. Centers using the
  // placement's own real footprint (footprintOf), then also lifts
  // HOLD_LIFT_ROWS further above that. Clamped onto the grid instead of
  // rejected when that puts it off-grid (cellFromEvent's null-outside-grid
  // behavior is for taps, not for a lifted drag target whose underlying
  // finger position may legitimately be off the top edge once lifted).
  function liftedCellFromEvent(obj, ev) {
    var span = footprintOf({ tick: 0, row: 0, type: obj.type });
    var w = span.t1 - span.t0, h = span.r1 - span.r0;
    var rect = grid.getBoundingClientRect();
    var col = Math.floor((ev.clientX - rect.left + canvasScroll.scrollLeft) / CELL) - Math.floor(w / 2);
    var row = Math.floor((ev.clientY - rect.top) / CELL) - Math.floor(h / 2) - HOLD_LIFT_ROWS;
    col = Math.max(0, Math.min(col, MAX_TICK - w));
    row = Math.max(0, Math.min(row, ROWS - h));
    return { tick: col, row: row };
  }

  // The lifted target always tracks the raw finger position (centered +
  // offset by HOLD_LIFT_ROWS), from the instant the hold fires - even
  // before any further movement, so the "picked up" feedback is immediate.
  // Whether that's a real drag or just a stationary hold that happened to
  // cross HOLD_MS is a separate question, tracked by comparing the raw
  // (un-lifted, un-centered) pointer cell against where the gesture
  // actually started - see press.moved below.
  // Small overlay canvas shown only while a placement is being hold-move-
  // dragged: draws just that one icon, sized to the visible viewport, so a
  // drag never has to redraw the full MAX_TICK-wide #grid canvas - measured
  // on a real device at ~281ms per full redraw, which is exactly why
  // per-pointermove dragging was so laggy: every drag frame was paying that
  // cost. #grid itself is redrawn (without this placement, via drawGrid's
  // skipIdx) once when the drag starts, and once more (with the
  // placement's final position baked in) when it ends - never in between.
  var dragOverlayCtx = null;
  function beginDragOverlay() {
    var viewW = canvasScroll.clientWidth, viewH = ROWS * CELL;
    dragOverlayCtx = sizeCanvas(dragOverlay, viewW, viewH);
    dragOverlay.style.left = canvasScroll.scrollLeft + "px";
    dragOverlay.style.display = "block";
  }
  function updateDragOverlay(obj) {
    var viewW = canvasScroll.clientWidth, viewH = ROWS * CELL;
    dragOverlayCtx.clearRect(0, 0, viewW, viewH);
    var t = TYPE_BY_ID[obj.type];
    if (obj.type === "boss") {
      var bo = bossOrigin(obj.tick, obj.row);
      dragOverlayCtx.drawImage(getBossCanvas(CELL), bo.tick * CELL - canvasScroll.scrollLeft, bo.row * CELL, 5 * CELL, 16 * CELL);
      return;
    }
    if (obj.type === "s2_boss") {
      var bo2 = s2BossOrigin(obj.tick, obj.row);
      drawS2BossPlaceholder(dragOverlayCtx, bo2.tick * CELL - canvasScroll.scrollLeft, bo2.row * CELL, CELL);
      return;
    }
    var glyph = GLYPHS[t.glyph];
    var box = CELL * (glyph.size / 8);
    dragOverlayCtx.drawImage(getGlyphCanvas(t.glyph, box), obj.tick * CELL - canvasScroll.scrollLeft, obj.row * CELL, box, box);
  }
  function endDragOverlay() {
    dragOverlay.style.display = "none";
    dragOverlayCtx = null;
  }

  function applyHoldMoveTarget(press, ev) {
    var obj = placements[press.placementIdx];
    var lifted = liftedCellFromEvent(obj, ev);
    obj.tick = lifted.tick;
    obj.row = lifted.row;
    updateDragOverlay(obj);
  }

  // Same-cell wobble (a real finger resting on a placement never sits
  // perfectly still) isn't a real move - only count it once the raw
  // pointer cell actually leaves the cell the gesture started in.
  function rawCellFromEvent(ev) {
    var rect = grid.getBoundingClientRect();
    return {
      tick: Math.floor((ev.clientX - rect.left + canvasScroll.scrollLeft) / CELL),
      row: Math.floor((ev.clientY - rect.top) / CELL)
    };
  }

  // #grid has touch-action:none and panning is driven entirely by JS
  // setting canvasScroll.scrollLeft directly (see the pan branches below) -
  // that's a 1:1 finger-to-scroll mapping with none of a native scroll's
  // momentum, so a fast flick just stopped dead the instant the finger
  // lifted. This restores that: track the pan's recent velocity and, on
  // release, keep scrolling with it, decelerating, like a normal browser
  // scroll would.
  function trackPanVelocity(press, ev) {
    var now = performance.now();
    if (press.lastMoveT) {
      var dt = now - press.lastMoveT;
      if (dt > 0) press.velX = (ev.clientX - press.lastMoveX) / dt;
    }
    press.lastMoveT = now;
    press.lastMoveX = ev.clientX;
  }

  var MOMENTUM_DECAY_PER_16MS = 0.94;
  var MOMENTUM_STOP_VELOCITY = 0.02; // px/ms
  var momentumRAF = null;
  function stopMomentum() {
    if (momentumRAF !== null) {
      cancelAnimationFrame(momentumRAF);
      momentumRAF = null;
    }
  }
  function startMomentum(velX) {
    stopMomentum();
    if (!velX || Math.abs(velX) < MOMENTUM_STOP_VELOCITY) return;
    var lastT = performance.now();
    function step(now) {
      var dt = now - lastT;
      lastT = now;
      canvasScroll.scrollLeft -= velX * dt;
      velX *= Math.pow(MOMENTUM_DECAY_PER_16MS, dt / 16);
      if (Math.abs(velX) < MOMENTUM_STOP_VELOCITY) {
        momentumRAF = null;
        return;
      }
      momentumRAF = requestAnimationFrame(step);
    }
    momentumRAF = requestAnimationFrame(step);
  }

  grid.addEventListener("pointerdown", function (ev) {
    inspectHandledByPointer = false;
    // A tap that lands while momentum is still coasting is a "stop the
    // scroll" tap, same as on a native scrollable page - it must not also
    // place/erase/inspect wherever it happened to land. Capture this before
    // stopMomentum() clears momentumRAF.
    var wasMomentumStop = momentumRAF !== null;
    stopMomentum();

    // copy_select/paste_preview bypass the whole pan/holdmove/tap gesture
    // system below - they're much simpler (no hold-to-drag, no momentum),
    // matching Sprite Editor's own copy_select/paste_preview: pointerdown
    // starts a rectangle (copy) or records the drag origin (paste),
    // pointermove updates it live, pointerup just ends the gesture.
    if (currentMode === "copy_select" || currentMode === "paste_preview") {
      if (wasMomentumStop) return;
      var specialHit = cellFromEvent(ev);
      if (!specialHit) return;
      specialPointerId = ev.pointerId;
      grid.setPointerCapture(ev.pointerId);
      if (currentMode === "copy_select") {
        selectionStart = specialHit;
        selectionEnd = specialHit;
        render();
      } else {
        specialDragStart = specialHit;
      }
      return;
    }

    var rect = grid.getBoundingClientRect();
    var offsetHit = enemy3OffsetHitTest(ev.clientX - rect.left + canvasScroll.scrollLeft, ev.clientY - rect.top);
    var c = cellFromEvent(ev);
    press = {
      pointerId: ev.pointerId,
      startX: ev.clientX,
      startY: ev.clientY,
      lastX: ev.clientX,
      lastY: ev.clientY,
      startScrollLeft: canvasScroll.scrollLeft,
      cell: c,
      offsetHit: offsetHit,
      placementIdx: (!eraseArmed && !armedType && c) ? placementIndexAtCell(c.tick, c.row) : -1,
      resolved: null,
      holdTimer: null,
      moved: false,
      wasMomentumStop: wasMomentumStop,
      // Velocity (px/ms) of the pan itself, from the most recent two
      // pointermove samples only - not the whole gesture's average, so a
      // slow drag that ends in a quick flick still hands off the flick's
      // speed to the momentum animation on release, not a diluted one.
      velX: 0,
      lastMoveT: 0,
      lastMoveX: ev.clientX
    };
    if (press.placementIdx >= 0 && !wasMomentumStop) {
      press.holdTimer = setTimeout(function () {
        if (!press || press.resolved) return;
        press.resolved = "holdmove";
        // One history entry for the whole gesture, pushed before the very
        // first (automatic) lift - if the finger never really moves, this
        // is exactly the entry endPress below pops to revert the preview.
        pushHistory();
        // Redraw the full grid once with this placement hidden (it's about
        // to live on the overlay instead), then hand off to the overlay for
        // every move from here until release - see beginDragOverlay's
        // comment on applyHoldMoveTarget for why.
        render(press.placementIdx);
        beginDragOverlay();
        // Jump to the lifted position immediately, using the most recent
        // pointer coordinates - a finger held perfectly still since
        // pointerdown should still see the icon pop up above it right
        // away, not wait for the next move event.
        applyHoldMoveTarget(press, { clientX: press.lastX, clientY: press.lastY });
        flash("move " + TYPE_BY_ID[placements[press.placementIdx].type].name + " - drag to reposition");
      }, HOLD_MS);
    }
    grid.setPointerCapture(ev.pointerId);
  });

  grid.addEventListener("pointermove", function (ev) {
    if (currentMode === "copy_select" || currentMode === "paste_preview") {
      if (specialPointerId === null || ev.pointerId !== specialPointerId) return;
      var specialHit = cellFromEvent(ev);
      if (!specialHit) return;
      if (currentMode === "copy_select") {
        selectionEnd = specialHit;
        render();
      } else if (specialDragStart) {
        pastePos.tick += specialHit.tick - specialDragStart.tick;
        pastePos.row += specialHit.row - specialDragStart.row;
        specialDragStart = specialHit;
        render();
      }
      return;
    }
    if (!press || ev.pointerId !== press.pointerId) return;
    press.lastX = ev.clientX;
    press.lastY = ev.clientY;
    var dx = ev.clientX - press.startX, dy = ev.clientY - press.startY;
    if (press.resolved === "holdmove") {
      var raw = rawCellFromEvent(ev);
      if (raw.tick !== press.cell.tick || raw.row !== press.cell.row) press.moved = true;
      applyHoldMoveTarget(press, ev);
      return;
    }
    if (press.resolved === "pan") {
      trackPanVelocity(press, ev);
      canvasScroll.scrollLeft = press.startScrollLeft - dx;
      return;
    }
    if (Math.hypot(dx, dy) > jitterTolerance()) {
      clearTimeout(press.holdTimer);
      press.resolved = "pan";
      trackPanVelocity(press, ev);
      canvasScroll.scrollLeft = press.startScrollLeft - dx;
    }
  });

  function endPress(ev) {
    if (currentMode === "copy_select" || currentMode === "paste_preview") {
      if (ev.pointerId === specialPointerId) specialPointerId = null;
      specialDragStart = null;
      return;
    }
    if (!press || ev.pointerId !== press.pointerId) return;
    clearTimeout(press.holdTimer);
    var p = press;
    press = null;
    // The browser fires a native 'click' right after this pointerup even
    // when pointer events already fully resolved the gesture (pan or
    // holdmove included) - mark it handled unconditionally here so the
    // click-fallback below never re-runs its own (inspect-only) hit-test
    // against stale coordinates once a holdmove has already relocated the
    // placement out from under them.
    inspectHandledByPointer = true;
    if (p.resolved === "pan") {
      startMomentum(p.velX);
      return;
    }
    if (p.resolved === "holdmove") {
      endDragOverlay();
      if (!p.moved) {
        // The finger never actually left its starting cell - the lift was
        // only a preview. Pop the history entry pushed at hold-fire to put
        // the placement back exactly where it was, so a stationary
        // hold+release is a true no-op on the grid: the same result a
        // plain tap would have given (inspect only), not a bogus "moved to
        // tick X row Y" confirmation or an accidental re-place/erase.
        restoreSnapshot(history.pop());
        btnUndo.disabled = history.length === 0;
        render();
        showCellInfo(placements[p.placementIdx]);
        return;
      }
      var obj = placements[p.placementIdx];
      placements.sort(function (a, b) { return a.tick - b.tick || a.row - b.row; });
      // Bake the placement's final position back into the full grid - it
      // was only ever drawn on the overlay (now hidden) while the drag was
      // in progress.
      render();
      flash("moved " + TYPE_BY_ID[obj.type].name + " to tick " + obj.tick + ", row " + obj.row);
      showCellInfo(obj);
      return;
    }
    // tap: released before the hold fired, without moving enough to pan.
    // A tap that started while momentum was still coasting was only there
    // to stop the scroll (already done, in pointerdown) - same as tapping
    // a native scrollable page mid-fling, it shouldn't also place, erase,
    // or inspect whatever happened to be under the finger.
    if (p.wasMomentumStop) return;
    if (p.offsetHit !== null) {
      openOffsetEditor(p.offsetHit);
      return;
    }
    var c = p.cell;
    if (!c) return;
    if (eraseArmed) {
      // Hit-test the tapped icon's real footprint, not just its anchor
      // cell - a 16x16 sprite or the boss's body must erase from anywhere
      // it's actually drawn, not only its top-left 8x8 cell.
      var eraseIdx = placementIndexAtCell(c.tick, c.row);
      if (eraseIdx < 0) {
        flash("nothing there to erase");
        return;
      }
      pushHistory();
      var erased = placements[eraseIdx];
      placements.splice(eraseIdx, 1);
      flash("erased " + TYPE_BY_ID[erased.type].name + " (tick " + erased.tick + ", row " + erased.row + ")");
      clearCellInfo();
      render();
      return;
    }
    if (armedType === "s2_terrain") {
      // round36-2: not a placements entry - writes straight into
      // terrain2 instead (see placeTerrainAt's own comment). No
      // showCellInfo/setCell here since there's no placement object to
      // inspect or store.
      placeTerrainAt(c.tick, c.row);
      return;
    }
    if (armedType) {
      pushHistory();
      setCell(c.tick, c.row, armedType);
      flash(TYPE_BY_ID[armedType].name + " → tick " + c.tick + ", row " + c.row);
      showCellInfo({ tick: c.tick, row: c.row, type: armedType });
      render();
      return;
    }
    // neutral tap on an already-placed cell - inspect only, don't touch
    // placements. The readout always reflects whatever's now at the
    // tapped cell, whether that's from placing, erasing, or just looking -
    // so it's never gated on first deselecting the armed palette type.
    var idx = placementIndexAtCell(c.tick, c.row);
    if (idx >= 0) {
      showCellInfo(placements[idx]);
    } else {
      clearCellInfo();
      flash("pick an enemy on the right first");
    }
  }
  grid.addEventListener("pointerup", endPress);
  grid.addEventListener("pointercancel", function (ev) {
    if (currentMode === "copy_select" || currentMode === "paste_preview") {
      if (ev.pointerId === specialPointerId) specialPointerId = null;
      specialDragStart = null;
      return;
    }
    if (!press || ev.pointerId !== press.pointerId) return;
    clearTimeout(press.holdTimer);
    if (press.resolved === "holdmove") {
      // Same treatment as a stationary hold+release (endPress's !p.moved
      // branch): pop the single history entry the hold pushed and restore
      // the full grid, so a cancelled gesture never leaves the placement
      // stuck at a half-dragged position or the overlay stuck on-screen.
      restoreSnapshot(history.pop());
      btnUndo.disabled = history.length === 0;
      endDragOverlay();
      render();
    }
    press = null;
  });

  // Fallback for the inspect readout: the browser synthesizes a real
  // 'click' from a tap independently of our own pointerdown/move/up gesture
  // state machine above, so this keeps "tap a placed cell to identify it"
  // working even on devices where that custom pointer tracking misbehaves
  // (inspectHandledByPointer skips this when pointerup already did the job,
  // so working setups don't double-flash).
  grid.addEventListener("click", function (ev) {
    if (currentMode !== "normal") return;
    if (inspectHandledByPointer) { inspectHandledByPointer = false; return; }
    if (eraseArmed || armedType) return;
    var rect = grid.getBoundingClientRect();
    if (enemy3OffsetHitTest(ev.clientX - rect.left + canvasScroll.scrollLeft, ev.clientY - rect.top) !== null) return;
    var c = cellFromEvent(ev);
    if (!c) return;
    var idx = placementIndexAtCell(c.tick, c.row);
    if (idx >= 0) {
      showCellInfo(placements[idx]);
    } else {
      clearCellInfo();
      flash("pick an enemy on the right first");
    }
  });

  // ---------- Copy / Paste ----------
  // Same UX as Sprite Editor's Copy/Paste (not its separate "Copy 0/1"
  // text feature): first click arms a mode and shows a manipulable
  // preview; second click on the same button confirms it. Sprite Editor's
  // "selection"/"paste data" are literal pixel bits, encoded as plain 0/1
  // text; here they're placements, so the clipboard payload is JSON
  // instead - a flat array of {dtick, drow, type, offset?} relative to the
  // selection's top-left corner (copy) or the drag position (paste).
  function copySelectionBounds() {
    return {
      minT: Math.min(selectionStart.tick, selectionEnd.tick),
      maxT: Math.max(selectionStart.tick, selectionEnd.tick),
      minR: Math.min(selectionStart.row, selectionEnd.row),
      maxR: Math.max(selectionStart.row, selectionEnd.row)
    };
  }

  // A placement is "in" the selection by its own anchor tick/row, not its
  // full drawn footprint (which for a 16x16 sprite or the boss can extend
  // well past the anchor cell) - simpler to reason about while dragging
  // the rectangle, and matches how the palette/inspect readout already
  // identify a placement by its anchor alone.
  function copyFromSelection() {
    var b = copySelectionBounds();
    var items = [];
    placements.forEach(function (p) {
      if (p.tick < b.minT || p.tick > b.maxT || p.row < b.minR || p.row > b.maxR) return;
      var item = { dtick: p.tick - b.minT, drow: p.row - b.minR, type: p.type };
      if (p.type === "enemy3_wave") item.offset = p.offset || 0;
      items.push(item);
    });
    return items;
  }

  function copiedSelectionText(items) {
    return JSON.stringify({ game: "CYBER SHMUP", kind: "schedule-selection", placements: items });
  }

  function parseCopiedText(text) {
    if (!text) return null;
    var data;
    try { data = JSON.parse(text); } catch (e) { return null; }
    if (!data || data.kind !== "schedule-selection" || !Array.isArray(data.placements)) return null;
    var items = data.placements.filter(function (p) {
      return p && TYPE_BY_ID[p.type] && Number.isInteger(p.dtick) && Number.isInteger(p.drow) && p.dtick >= 0 && p.drow >= 0;
    }).map(function (p) {
      var item = { dtick: p.dtick, drow: p.drow, type: p.type };
      if (p.type === "enemy3_wave") item.offset = Number.isInteger(p.offset) ? p.offset : 0;
      return item;
    });
    return items.length ? items : null;
  }

  var btnCopy = document.getElementById("btnCopy");
  btnCopy.addEventListener("click", function () {
    if (currentMode !== "copy_select") {
      armedType = null;
      eraseArmed = false;
      document.getElementById("btnErase").classList.remove("armed");
      refreshPaletteArmed();
      currentMode = "copy_select";
      // Default to the current viewport, full row height - a workable
      // starting rectangle to drag-adjust. Defaulting to the whole
      // 999-tick timeline (as Sprite Editor does for its own small,
      // fixed-size grid) would be an unusable rectangle here.
      var firstTick = Math.max(0, Math.round(canvasScroll.scrollLeft / CELL));
      var viewTicks = Math.max(1, Math.floor(canvasScroll.clientWidth / CELL) - 1);
      selectionStart = { tick: firstTick, row: 0 };
      selectionEnd = { tick: Math.min(MAX_TICK - 1, firstTick + viewTicks), row: ROWS - 1 };
      render();
      flash("範囲をドラッグで調整し、もう一度Copyで確定");
    } else {
      var items = copyFromSelection();
      if (!items.length) {
        flash("選択範囲に配置がありません");
        exitSpecialModes();
        return;
      }
      var text = copiedSelectionText(items);
      lastCopiedText = text;
      copyToClipboard(text, "選択範囲(" + items.length + "件)をコピーしました");
      exitSpecialModes();
    }
  });

  function initPastePreview(items) {
    if (!items || !items.length) {
      flash("ペーストできる有効なデータがありません");
      return;
    }
    armedType = null;
    eraseArmed = false;
    document.getElementById("btnErase").classList.remove("armed");
    refreshPaletteArmed();
    currentMode = "paste_preview";
    pasteData = items;
    pastePos = { tick: Math.max(0, Math.round(canvasScroll.scrollLeft / CELL)), row: 0 };
    render();
    flash("位置をドラッグで合わせ、もう一度Pasteで確定");
  }

  function pasteCommit() {
    pushHistory();
    var placed = 0;
    pasteData.forEach(function (pd) {
      var tick = pastePos.tick + pd.dtick, row = pastePos.row + pd.drow;
      if (tick < 0 || tick >= MAX_TICK || row < 0 || row >= ROWS) return;
      var idx = placementAt(tick, row);
      if (idx >= 0) placements.splice(idx, 1);
      var p = { tick: tick, row: row, type: pd.type };
      if (pd.type === "enemy3_wave") p.offset = pd.offset || 0;
      placements.push(p);
      placed++;
    });
    placements.sort(function (a, b) { return a.tick - b.tick || a.row - b.row; });
    flash("ペーストを確定しました (" + placed + "件)");
  }

  var btnPaste = document.getElementById("btnPaste");
  btnPaste.addEventListener("click", function () {
    if (currentMode !== "paste_preview") {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (clipText) {
          initPastePreview(parseCopiedText(clipText) || parseCopiedText(lastCopiedText));
        }).catch(function () {
          initPastePreview(parseCopiedText(lastCopiedText));
        });
      } else {
        initPastePreview(parseCopiedText(lastCopiedText));
      }
    } else {
      if (pasteData && pasteData.length) pasteCommit();
      exitSpecialModes();
    }
  });

  function exitSpecialModes() {
    currentMode = "normal";
    selectionStart = null;
    selectionEnd = null;
    pasteData = null;
    specialPointerId = null;
    specialDragStart = null;
    endDragOverlay();
    render();
  }

  // Draws the copy_select rectangle or the paste_preview ghost onto
  // #dragOverlay - same canvas the holdmove drag uses (see beginDragOverlay
  // et al above), safe to share since holdmove's own gesture handling is
  // bypassed entirely while a special mode is active.
  function drawModeOverlay() {
    if (currentMode !== "copy_select" && currentMode !== "paste_preview") {
      dragOverlay.style.display = "none";
      return;
    }
    var viewW = canvasScroll.clientWidth, viewH = ROWS * CELL;
    var ctx = sizeCanvas(dragOverlay, viewW, viewH);
    dragOverlay.style.left = canvasScroll.scrollLeft + "px";
    dragOverlay.style.display = "block";
    ctx.clearRect(0, 0, viewW, viewH);

    if (currentMode === "copy_select") {
      if (!selectionStart || !selectionEnd) return;
      var b = copySelectionBounds();
      var x = b.minT * CELL - canvasScroll.scrollLeft, y = b.minR * CELL;
      var w = (b.maxT - b.minT + 1) * CELL, h = (b.maxR - b.minR + 1) * CELL;
      ctx.fillStyle = "rgba(79, 210, 255, 0.18)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = tok("--accent");
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, Math.max(0, w - 2), Math.max(0, h - 2));
      return;
    }

    // paste_preview
    if (!pasteData) return;
    ctx.globalAlpha = 0.7;
    pasteData.forEach(function (pd) {
      var t = TYPE_BY_ID[pd.type];
      if (!t) return;
      var tick = pastePos.tick + pd.dtick, row = pastePos.row + pd.drow;
      var px = tick * CELL - canvasScroll.scrollLeft, py = row * CELL;
      if (pd.type === "boss") {
        var bo = bossOrigin(tick, row);
        ctx.drawImage(getBossCanvas(CELL), bo.tick * CELL - canvasScroll.scrollLeft, bo.row * CELL, 5 * CELL, 16 * CELL);
        return;
      }
      if (pd.type === "s2_boss") {
        var bo2 = s2BossOrigin(tick, row);
        drawS2BossPlaceholder(ctx, bo2.tick * CELL - canvasScroll.scrollLeft, bo2.row * CELL, CELL);
        return;
      }
      var glyph = GLYPHS[t.glyph];
      var box = CELL * (glyph.size / 8);
      ctx.drawImage(getGlyphCanvas(t.glyph, box), px, py, box, box);
    });
    ctx.globalAlpha = 1;
  }

  // keep the ruler and scrub slider in sync with the scrollable grid (this
  // is the "swipe" pan), and repaint #grid for its new scroll position -
  // it's viewport-sized now (see drawGrid's scrollX param), not a
  // pre-rendered full-width canvas, so every scroll (pan gesture, the
  // scrub slider, or a native scrollbar/wheel/trackpad scroll) needs a
  // fresh draw to show anything.
  canvasScroll.addEventListener("scroll", function () {
    rulerScroll.scrollLeft = canvasScroll.scrollLeft;
    scrubSlider.value = String(Math.round(canvasScroll.scrollLeft / CELL));
    render();
  }, { passive: true });

  // Scrub slider: jumps/scrolls to any tick 0-999 directly, replacing the
  // old one-screen-at-a-time Prev/Next buttons. "input" (not "change")
  // fires continuously while dragging, so the grid tracks the slider live
  // instead of only updating on release. Setting scrubSlider.value
  // programmatically (in the scroll listener above) never itself fires
  // "input", so there's no feedback loop between the two listeners.
  var scrubSlider = document.getElementById("scrubSlider");
  scrubSlider.max = String(MAX_TICK);
  scrubSlider.addEventListener("input", function () {
    var tick = parseInt(scrubSlider.value, 10) || 0;
    var maxScroll = Math.max(0, canvasScroll.scrollWidth - canvasScroll.clientWidth);
    canvasScroll.scrollLeft = Math.min(tick * CELL, maxScroll);
  });

  // ---------- save / load ----------
  // round32: "出力も別に分ける" - the export carries which stage it's
  // for (used by importJSONText's own mismatch check below), and the
  // suggested filename defaults differently per stage so the two never
  // collide/overwrite each other on disk by accident.
  function currentJSON() {
    var out = {
      version: 1,
      game: "CYBER SHMUP",
      stage: STAGE,
      maxTick: MAX_TICK,
      placements: placements.slice().sort(function (a, b) { return a.tick - b.tick || a.row - b.row; })
    };
    // round36 ("現在の地形データをJsonに含めて出力してくれ"): Stage2 only
    // (Stage1 has no terrain system at all - see terrain2's own comment).
    // Per-column tier array, NOT included for Stage1 exports at all
    // (rather than an empty array) so old Stage1-only tooling/consumers
    // never see a field they don't understand.
    if (STAGE === 2) out.terrain = terrain2.slice();
    return JSON.stringify(out, null, 2);
  }

  var saveOverlay = document.getElementById("saveOverlay");
  var saveFilenameInput = document.getElementById("saveFilenameInput");
  var saveStatus = document.getElementById("saveStatus");

  document.getElementById("btnSave").addEventListener("click", function () {
    saveStatus.textContent = "";
    saveStatus.classList.remove("ok");
    saveOverlay.classList.add("show");
    saveFilenameInput.value = STAGE === 1 ? "Schedule.json" : "Schedule2.json";
    saveFilenameInput.focus();
    saveFilenameInput.select();
  });

  // round33 bugfix, 2nd pass ("セーブできねえよ"): the previous pass still
  // failed because it read `window.claude.downloads` directly - that is
  // NOT how the published-Artifact runtime actually exposes the downloads
  // capability. Per the current contract (window.claude carries ONLY a
  // `use()` method - no `.downloads`/`.db`/etc member is ever promised on
  // it directly), the real call is `await claude.use("downloads")`, which
  // resolves the namespace only once the viewer has answered - or `null`
  // if this view can't run it at all. Reading `window.claude.downloads`
  // synchronously is always `undefined` in this runtime, so the old code's
  // `if (window.claude && window.claude.downloads)` check was always
  // false and silently fell through to the Blob+<a download> link, which
  // the Artifact viewer's own sandbox blocks outright (any download the
  // page starts itself is inert there, with no visible error) - that's
  // the actual root cause of "セーブできねえよ" with no error message at
  // all. Fixed to call the real `claude.use("downloads")` API, with the
  // `downloads` capability declared at publish time so it isn't rejected
  // as ungranted. navigator.share is still tried first (works outside any
  // sandbox, e.g. a plain mobile browser tab opening this file directly -
  // that's very likely why sprite-editor.html "just worked" for the user,
  // if it was being tested that way rather than through an Artifact URL);
  // the classic Blob link stays as the last-resort fallback for a fully
  // vanilla static host / file:// with neither Web Share nor
  // window.claude at all.
  function doSaveViaBlobLink(filename, jsonStr) {
    try {
      var blob = new Blob([jsonStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 100);
      saveOverlay.classList.remove("show");
      flash("saved " + filename);
    } catch (err) {
      saveStatus.textContent = "save failed";
      saveStatus.classList.remove("ok");
    }
  }

  // Memoized per claude.d.ts's own guidance ("every use('db') yields the
  // same promise object") - only ever ask the viewer once per page load.
  var downloadsCapabilityPromise = null;
  function getDownloadsCapability() {
    if (!downloadsCapabilityPromise) {
      downloadsCapabilityPromise = (window.claude && window.claude.use)
        ? window.claude.use("downloads").catch(function () { return null; })
        : Promise.resolve(null);
    }
    return downloadsCapabilityPromise;
  }

  function doSaveViaDownloadsCapability(filename, jsonStr) {
    getDownloadsCapability().then(function (downloads) {
      if (!downloads) { doSaveViaBlobLink(filename, jsonStr); return; }
      downloads.save({ filename: filename, data: jsonStr }).then(
        function () {
          saveOverlay.classList.remove("show");
          flash("saved " + filename);
        },
        function (err) {
          if (err && err.code === "declined") { saveOverlay.classList.remove("show"); flash("save cancelled"); return; }
          saveStatus.textContent = "save failed" + (err && err.message ? ": " + err.message : "");
          saveStatus.classList.remove("ok");
        }
      );
    });
  }

  function doSave() {
    var filename = saveFilenameInput.value.trim() || (STAGE === 1 ? "Schedule.json" : "Schedule2.json");
    var jsonStr = currentJSON();

    var file = null;
    try { file = new File([jsonStr], filename, { type: "application/json" }); } catch (e) {}
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(
        function () {
          saveOverlay.classList.remove("show");
          flash("saved " + filename);
        },
        function (err) {
          if (err && err.name === "AbortError") { saveOverlay.classList.remove("show"); flash("save cancelled"); return; }
          doSaveViaDownloadsCapability(filename, jsonStr);
        }
      );
      return;
    }

    doSaveViaDownloadsCapability(filename, jsonStr);
  }

  function copyToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flash(successMsg); },
        function () { copyViaTempTextarea(text, successMsg); }
      );
    } else {
      copyViaTempTextarea(text, successMsg);
    }
  }

  function copyViaTempTextarea(text, successMsg) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(ok ? successMsg : "コピーできませんでした");
  }

  document.getElementById("btnSaveCancel").addEventListener("click", function () {
    saveOverlay.classList.remove("show");
  });
  document.getElementById("btnSaveCopy").addEventListener("click", function () {
    copyToClipboard(currentJSON(), "JSONをコピーしました（ファイルに貼り付けて保存してください）");
  });
  document.getElementById("btnSaveConfirm").addEventListener("click", doSave);
  saveFilenameInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") doSave();
    if (ev.key === "Escape") saveOverlay.classList.remove("show");
  });
  saveOverlay.addEventListener("click", function (ev) {
    if (ev.target === saveOverlay) saveOverlay.classList.remove("show");
  });

  // enemy4/enemy5 used to be split into 3 palette entries each
  // (_y16/_y32/_y48, picking a Top/Mid/Bottom baseY) before SPAWN_E4/SPAWN_E4B
  // switched to reading baseY from SPAWN_BASEY_TABLE[row placed] for any row -
  // see SPAWN_E4's comment in CYBER SHMUP.asm. Enemy2 went through the same
  // collapse (e2a_top/e2a_bot/e2b_top/e2b_bot -> enemy2) once SPAWN_E2 started
  // reading baseY the same way and auto-picking its A/B RAM instance instead
  // of the caller choosing one. None of these splits affect anything in-game
  // anymore, but old saved JSON can still contain the old ids, so remap them
  // here rather than silently dropping those placements on load.
  var LEGACY_TYPE_ALIASES = {
    enemy4_y16: "enemy4", enemy4_y32: "enemy4", enemy4_y48: "enemy4",
    enemy5_y16: "enemy5", enemy5_y32: "enemy5", enemy5_y48: "enemy5",
    e2a_top: "enemy2", e2a_bot: "enemy2", e2b_top: "enemy2", e2b_bot: "enemy2"
  };

  // Returns a status message rather than showing it - callers decide
  // where that's safe to display. Loading a file is not an edit, so it
  // doesn't touch the undo history - it wouldn't make sense to "undo"
  // your way back through a fresh load into whatever was there before.
  function importJSONText(text) {
    var data = JSON.parse(text);
    // round36-2: tolerate a file with no (or a malformed) placements
    // array - e.g. a terrain-only export from before terrain was folded
    // into the normal palette/placement flow - instead of refusing the
    // whole load outright. Treated as zero placements rather than an
    // error, since a Stage2 file can still carry a perfectly good
    // "terrain" field worth loading even with nothing else in it.
    if (!Array.isArray(data.placements)) data.placements = [];
    // round32: "相互には登録できないように" - a file saved with a "stage"
    // field (every export from this round on, see currentJSON) that
    // doesn't match the currently active stage is rejected outright,
    // with a clear reason, rather than silently loading 0 placements
    // (which the id-namespacing below would ALSO naturally produce on
    // its own, just with a much more confusing message - every Stage1
    // id lookup fails against TYPE_BY_ID2 and vice versa, since Stage2
    // ids are all "s2_"-prefixed and never collide with Stage1's own).
    // Older files with no "stage" field (saved before this round) fall
    // through to that same per-placement filter untouched, same
    // backward-compat treatment LEGACY_TYPE_ALIASES already gets below.
    if (Number.isInteger(data.stage) && data.stage !== STAGE) {
      throw new Error("this file is for Stage " + data.stage + " (currently on Stage " + STAGE + " - switch stage first)");
    }
    exitSpecialModes();
    var remapped = data.placements.map(function (p) {
      var alias = p && LEGACY_TYPE_ALIASES[p.type];
      return alias ? Object.assign({}, p, { type: alias }) : p;
    });
    var valid = remapped.filter(function (p) {
      return TYPE_BY_ID[p.type] && Number.isInteger(p.tick) && Number.isInteger(p.row);
    });
    setPlacements(valid);
    // round36: terrain, Stage2 only. A file with no "terrain" field at
    // all (an older Stage2 export, or one that only ever touched
    // placements) leaves whatever's currently loaded untouched, rather
    // than silently reverting it to DEFAULT_TERRAIN2 - loading a
    // placements-only file should never clobber terrain work already in
    // progress. An actually-present-but-malformed terrain array (wrong
    // type, empty, or any value outside 0-3) is rejected the same way,
    // flagged in the returned status message rather than silently eaten.
    var terrainNote = "";
    if (STAGE === 2 && data.terrain !== undefined) {
      var validTerrain = Array.isArray(data.terrain) && data.terrain.length > 0 &&
        data.terrain.every(function (t) { return Number.isInteger(t) && t >= 0 && t <= 3; });
      if (validTerrain) {
        setTerrain2(data.terrain.slice());
        terrainNote = ", terrain (" + terrain2.length + " cols)";
      } else {
        terrainNote = ", terrain field ignored (invalid)";
      }
    }
    render();
    var skipped = data.placements.length - valid.length;
    return "loaded " + valid.length + " placements" + terrainNote + (skipped ? " (" + skipped + " skipped - bad type/tick/row)" : "");
  }

  document.getElementById("fileInput").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { flash(importJSONText(reader.result)); }
      catch (e) { flash("could not read that file: " + e.message); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  // round36-3: "Load Text" - paste-JSON alternative to the file picker
  // above (see loadOverlay's own HTML comment for why this exists at
  // all). Status shown inline in the card, same reasoning as the Save
  // overlay's own #saveStatus: a toast at the screen edge can end up
  // hidden behind an on-screen keyboard right after pasting.
  var loadOverlay = document.getElementById("loadOverlay");
  var loadTextInput = document.getElementById("loadTextInput");
  var loadStatus = document.getElementById("loadStatus");
  document.getElementById("btnLoadText").addEventListener("click", function () {
    loadStatus.textContent = "";
    loadStatus.classList.remove("ok");
    loadTextInput.value = "";
    loadOverlay.classList.add("show");
    loadTextInput.focus();
  });
  function closeLoadOverlay() {
    loadOverlay.classList.remove("show");
  }
  document.getElementById("btnLoadTextCancel").addEventListener("click", closeLoadOverlay);
  document.getElementById("btnLoadTextConfirm").addEventListener("click", function () {
    var text = loadTextInput.value.trim();
    if (!text) {
      loadStatus.textContent = "paste some JSON first";
      loadStatus.classList.remove("ok");
      return;
    }
    try {
      var msg = importJSONText(text);
      loadStatus.textContent = msg;
      loadStatus.classList.add("ok");
      flash(msg);
      closeLoadOverlay();
    } catch (e) {
      loadStatus.textContent = "could not load that: " + e.message;
      loadStatus.classList.remove("ok");
    }
  });
  loadTextInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeLoadOverlay();
  });
  loadOverlay.addEventListener("click", function (ev) {
    if (ev.target === loadOverlay) closeLoadOverlay();
  });

  // ---------- misc UI ----------
  var liveMsg = document.getElementById("liveMsg");
  var flashTimer = null;
  function flash(msg) {
    liveMsg.textContent = msg;
    liveMsg.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { liveMsg.classList.remove("show"); }, 1800);
  }

  function render(skipIdx) {
    var gctx = grid.getContext("2d");
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawGrid(gctx, canvasScroll.clientWidth, ROWS * CELL, skipIdx, canvasScroll.scrollLeft);
    var rctx = ruler.getContext("2d");
    rctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawRuler(rctx, canvasScroll.clientWidth, RULER_H, canvasScroll.scrollLeft);
    drawModeOverlay();
    btnCopy.classList.toggle("active-mode", currentMode === "copy_select");
    btnPaste.classList.toggle("active-mode", currentMode === "paste_preview");
  }

  // ---------- boot ----------
  layout();
  render();
  window.addEventListener("resize", function () { layout(); render(); });
})();
</script>
</body>
