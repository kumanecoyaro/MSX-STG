<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER SHMUP — Spawn Schedule Editor</title>
<style>
  :root {
    --bg: #05080d;
    --surface: #0b1220;
    --surface-2: #0e1626;
    --line: #17233a;
    --grid-line: #1a2f52;
    --grid-line-strong: #2c58a0;
    --ink: #eaf1fb;
    --ink-dim: #7f93ad;
    --ink-faint: #4c5f7d;
    --accent: #4fd2ff;
    --accent-ink: #04141c;
    --danger: #ff5d6c;
    --danger-ink: #260607;
    --ok: #6bdc7c;
    --warn: #ffd166;
    --terrain-rock: #8b5a2b;         /* matches ROCK_COLOR's own fg (medium red) closely enough as a placeholder block, warmer than the sky/blank fill below */
    --terrain-sky: rgba(139, 90, 43, 0.12);

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: row;
    /* 100vh on mobile Chrome/Vivaldi is sized to the viewport with the
       address bar HIDDEN, which is taller than what's actually visible
       whenever the bar is showing - the extra height pushed the sidebar's
       lower rows past the real bottom edge with no way to scroll to them
       (html/body has overflow:hidden). 100dvh tracks the actually-visible
       viewport instead; the plain 100vh above is just the fallback for
       browsers without dvh support. */
    height: 100vh;
    height: 100dvh;
  }

  button, .btn-label {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 7px 8px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  /* .btn-label wraps the hidden file input directly (native label-for
     file-picker trigger) instead of a button that proxies a JS .click()
     onto it - synthetic clicks on file inputs are unreliable inside a
     sandboxed frame, this isn't. */
  .btn-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  button:hover, .btn-label:hover { border-color: var(--ink-faint); }
  button:active, .btn-label:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger-btn { background: var(--surface-2); color: var(--danger); border-color: #4a2226; }
  button.danger-btn.armed { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
  button.active-mode { background: var(--warn); color: #111; border-color: var(--warn); }

  /* ---------- grid area (left, fills remaining space) ---------- */
  .gridwrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
  }

  .ruler-row {
    display: flex;
    flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .gutter-corner {
    flex: 0 0 var(--gutter-w);
    background: var(--surface);
  }
  .ruler-scroll {
    overflow: hidden;
    flex: 1 1 auto;
  }
  #ruler {
    display: block;
  }

  .grid-row {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
  }
  .scrub-row {
    flex: 0 0 auto;
    padding: 6px 12px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  #scrubSlider {
    display: block;
    width: 100%;
    accent-color: var(--accent);
  }
  .row-gutter-scroll {
    overflow: hidden;
    flex: 0 0 var(--gutter-w);
  }
  #rowGutter { display: block; }

  .canvas-scroll {
    position: relative;
    flex: 1 1 auto;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  /* Invisible - exists only to give #canvasScroll a scrollWidth spanning
     the full MAX_TICK-tick timeline, since #grid itself (see below) no
     longer does: it's sized to the viewport and repainted on scroll
     instead of pre-rendering the whole timeline once. */
  .grid-spacer {
    width: 1px;
    height: 1px;
  }
  /* Sits over #grid at the same viewport position, showing only the one
     placement currently being hold-move-dragged - see the "drag overlay"
     JS comment near applyHoldMoveTarget for why this exists (redrawing
     #grid - even just its now-viewport-sized area - on every single
     pointermove was still too slow on at least one real device). */
  #dragOverlay {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    display: none;
  }
  /* touch-action is permanently off, not toggled at drag-start - toggling
     it mid-gesture is unreliable (the browser can already have committed
     to native scrolling by the time a hold timer fires). Panning is
     driven entirely in JS instead (see the pointer handlers), resolved
     into exactly one of pan/hold-move/tap per gesture.
     position:sticky pins #grid to the scrollport's left edge as
     #canvasScroll scrolls past .grid-spacer, so the canvas element itself
     only ever needs to be as wide as what's visible - see drawGrid's
     scrollX param for the corresponding "draw at (world - scrollX)" side
     of this. */
  #grid {
    position: sticky;
    top: 0;
    left: 0;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  /* ---------- right sidebar: identity, stats, actions, palette ---------- */
  /* Kept deliberately thin - the grid is the workspace, the sidebar is */
  /* just controls. Palette entries are small color chips (number+code, */
  /* the same glyph the grid itself draws for a placement) rather than  */
  /* name+description cards, so 10 enemy types cost a few rows, not a   */
  /* scroll-hogging list. Full names live in the title attr + the       */
  /* one-line "armed" readout, not baked into every chip.               */
  aside {
    flex: 0 0 196px;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    /* Content (title + both button rows + full palette) can be taller than
       the box in a short viewport (e.g. real mobile browser chrome eating
       into 100vh/42vh differently than the Artifact host's frame did) -
       scroll the sidebar itself instead of silently clipping whatever
       doesn't fit, which also made the clipped buttons untappable. */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .side-title {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .side-title .name {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .side-title .sub {
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  /* Fixed pixel sizes, deliberately NOT derived from the viewport/container
     width (no % or fr units) - this is a tool, its controls must look and
     sit exactly the same on every device instead of reflowing/resizing.
     If the sidebar is ever narrower than the row, it scrolls horizontally
     (overflow-x below) rather than shrinking the buttons. */
  .side-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .btn-row { display: flex; gap: 4px; }
  .side-actions button, .side-actions .btn-label {
    width: 74px;
    height: 32px;
    flex: 0 0 auto;
    padding: 0;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-actions button.half { width: 35px; }
  /* Pure layout spacer, no min-content width of its own - pushes the
     left/right scroll buttons flush to the row's right edge without
     giving any button a size that depends on available width. */
  .spacer { flex: 1 1 auto; }
  /* Several enemy types render the exact same icon (see GLYPHS.asterisk16's
     comment) - this is where a tapped placed cell's real type + position
     shows up, since the grid icon alone can't tell them apart. */
  .cell-info {
    flex: 1 1 auto;
    min-width: 0;
    padding-left: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cell-info-icon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    display: none;
  }
  .cell-info-icon.show { display: block; }
  .cell-info-text {
    min-width: 0;
    font-size: 11px;
    color: var(--ink-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .palette {
    overflow-y: auto;
    padding: 5px 8px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
    min-height: 0;
  }
  .pitem {
    position: relative;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    border: 2px solid var(--line);
    background: var(--surface-2);
    cursor: pointer;
    padding: 0;
    color: var(--ink-dim);
    font-family: var(--font-mono);
    font-size: 8px;
    font-weight: 700;
  }
  .pitem:hover { border-color: var(--ink-faint); }
  .pitem.armed {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .pitem .picon { display: block; pointer-events: none; }
  /* Boss has no glyph icon of its own (see TYPES) - just text - so it
     needs its own visual distinction some other way. Red singles it out
     as the one placement that isn't a regular enemy. */
  .pitem-boss { background: var(--danger); color: var(--danger-ink); border-color: var(--danger); }
  .pitem-boss:hover { border-color: var(--danger); }

  #liveMsg {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 8px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
    max-width: min(70vw, 480px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #liveMsg.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 8, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    width: min(560px, 100%);
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .overlay-title { font-size: 13px; font-weight: 600; }
  #offsetInput, #saveFilenameInput, #loadTextInput {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 15px;
  }
  #loadTextInput {
    width: 100%;
    height: 40vh;
    resize: vertical;
    font-size: 12px;
    white-space: pre;
  }
  .overlay-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .overlay-actions button { padding: 8px 14px; }
  /* Inline, not the bottom-fixed toast - on mobile a toast at the
     screen edge can end up hidden behind the on-screen keyboard right
     after typing/pasting into the textarea above, making a real error
     silently invisible. This sits in the card itself instead. */
  .overlay-status {
    font-size: 11.5px;
    color: var(--danger);
    min-height: 1.2em;
  }
  .overlay-status.ok { color: var(--ok); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- narrow viewports (phone, or a narrow browser pane): ---------- */
  /* the grid is the whole point, so it stays full-width and on top; the    */
  /* sidebar drops below as a short, capped-height strip instead of eating  */
  /* most of the screen's width down a 236px column.                       */
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .gridwrap { height: auto; flex: 1 1 auto; min-height: 0; }
    aside {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      max-height: 42vh;
      max-height: 42dvh;
      border-left: none;
      border-top: 1px solid var(--line);
    }
    .side-title { display: none; }
  }
</style>

<body>
  <div class="gridwrap">
    <div class="ruler-row">
      <div class="gutter-corner"></div>
      <div class="ruler-scroll"><canvas id="ruler"></canvas></div>
    </div>
    <div class="grid-row">
      <div class="row-gutter-scroll"><canvas id="rowGutter"></canvas></div>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="grid-spacer" id="gridSpacer"></div>
        <canvas id="grid"></canvas>
        <canvas id="dragOverlay"></canvas>
      </div>
    </div>
    <div class="scrub-row">
      <input type="range" id="scrubSlider" min="0" max="999" step="1" value="0" title="Scrub to any tick, 0-999">
    </div>
  </div>

  <aside>
    <div class="side-title">
      <div class="name">CYBER SHMUP</div>
      <div class="sub">spawn schedule editor</div>
    </div>

    <div class="side-actions">
      <div class="btn-row">
        <button id="btnStage1" style="flex: 1 1 50%;">Stage 1</button>
        <button id="btnStage2" style="flex: 1 1 50%;">Stage 2</button>
      </div>
      <div class="btn-row">
        <label class="btn-label" for="fileInput">Load JSON</label>
        <input type="file" id="fileInput" accept=".json" hidden>
        <button id="btnLoadText">Load Text</button>
      </div>
      <div class="btn-row">
        <button id="btnCopy">Copy</button>
        <button id="btnPaste">Paste</button>
      </div>
      <div class="btn-row">
        <button class="primary" id="btnSave">Save JSON</button>
        <button class="danger-btn" id="btnErase">Erase</button>
        <button id="btnDeselect">Deselect</button>
        <button id="btnUndo" disabled>Undo</button>
      </div>
      <div class="btn-row">
        <div class="cell-info" id="cellInfo" title="Tap a placed cell on the grid to identify it - several types share the same icon">
          <canvas class="cell-info-icon" id="cellInfoIcon"></canvas>
          <span class="cell-info-text" id="cellInfoText"></span>
        </div>
      </div>
    </div>

    <div class="palette" id="palette"></div>
  </aside>

  <div id="liveMsg"></div>

  <div id="offsetOverlay" class="overlay">
    <div class="overlay-card" style="width: min(320px, 100%);">
      <div class="overlay-title" id="offsetOverlayTitle">Edit offset</div>
      <input type="number" id="offsetInput" inputmode="numeric" step="1" min="0">
      <div class="overlay-status" id="offsetStatus"></div>
      <div class="overlay-actions">
        <button id="btnOffsetCancel">Cancel</button>
        <button class="primary" id="btnOffsetSave">Save</button>
      </div>
    </div>
  </div>

  <div id="saveOverlay" class="overlay">
    <div class="overlay-card" style="width: min(320px, 100%);">
      <div class="overlay-title">Save as</div>
      <input type="text" id="saveFilenameInput" value="Schedule.json">
      <div class="overlay-status" id="saveStatus"></div>
      <div class="overlay-actions">
        <button id="btnSaveCancel">Cancel</button>
        <button id="btnSaveCopy">Copy JSON</button>
        <button class="primary" id="btnSaveConfirm">Save</button>
      </div>
    </div>
  </div>

  <!-- round36-3 ("コンソールのアーティファクトではロードがファイル指定
       ではなく決め打ちされてて...これでどうやって任意のファイルを読む
       んだよ"): native <input type=file> file-picking can be unreliable
       or entirely unavailable inside a sandboxed Artifact preview (this
       page is very likely being viewed as exactly that, not opened
       directly as a local file in an ordinary browser tab) - same class
       of sandbox restriction the Save flow already had to work around
       (see doSaveViaDownloadsCapability's own comment history). This is
       a second, independent way IN that never depends on a native file
       dialog at all: paste JSON text directly and load it, using only a
       plain textarea + button - works identically whether this page is
       a real file:// tab or an embedded Artifact iframe. -->
  <div id="loadOverlay" class="overlay">
    <div class="overlay-card" style="width: min(560px, 100%);">
      <div class="overlay-title">Load from pasted JSON</div>
      <textarea id="loadTextInput" placeholder="Paste a full Schedule/Schedule2 JSON export here"></textarea>
      <div class="overlay-status" id="loadStatus"></div>
      <div class="overlay-actions">
        <button id="btnLoadTextCancel">Cancel</button>
        <button class="primary" id="btnLoadTextConfirm">Load</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- real in-game sprite/pattern data, transcribed byte-for-byte ----------
  // from CYBER SHMUP.asm (see ASTERISK_PATTERN, ENEMY3_PATTERN1, ENEMY4_PATTERN
  // and their draw sites for exact source lines; the boss's own BOSS_PATTERNS/
  // BOSS_MAP are transcribed separately below). 16x16 entries use
  // the MSX1 hardware sprite quadrant order [top-left, bottom-left, top-right,
  // bottom-right], 8 bytes each, 1 bit/pixel (bit7=leftmost). "rows" (8x8) is a
  // background/nametable character instead - drawn opaque (bg fill + fg pixels),
  // not transparent like a sprite.
  var GLYPHS = {
    // simple/Enemy1's look - also reused as-is for e2a/e2b's formation members and
    // for enemy5 (TYPE_ENEMY1_LOOK is pixel-identical to Enemy1, just a different
    // BEHAVIOR/score - see REDRAW_UNIT_PATTERN's call sites). Gray, SPR_GRAY(0Eh).
    // This is E1A_PATTERN/ASTERISK_PATTERN's base frame (seq0 of the 1,2,3,2
    // quadrant animation cycle - see ENEMY_ANIM_SEQ_TABLE) - the older,
    // rounder asterisk this replaced is gone from the ASM entirely now.
    asterisk16: {
      size: 16,
      quads: {
        tl: [0x7F, 0x9E, 0x04, 0x1B, 0x1B, 0x04, 0x9E, 0x7F],
        bl: [0, 0, 0, 0, 0, 0, 0, 0],
        tr: [0, 0, 0, 0, 0, 0, 0, 0],
        br: [0x7F, 0x9E, 0x04, 0x1B, 0x1B, 0x04, 0x9E, 0x7F]
      },
      color: "#cccccc"
    },
    // Enemy3's pulse animation frame1 (ENEMY3_PATTERN1) - an 8x8 BG tile, not a
    // sprite, so it's opaque: FG gray on BG dark-blue (COLORDATA group19 = E4h).
    enemy3: {
      size: 8,
      rows: [0x00, 0x00, 0x00, 0xFF, 0xFF, 0x00, 0x00, 0x00],
      color: "#cccccc",
      bg: "#5955e0"
    },
    // Enemy4's static hand-drawn look (ENEMY4_PATTERN) - black, SPR_BLACK(01h)
    // as of the BEHAVIOR_SIMPLE_DRIFT_DODGE recolor (it used to be light
    // green); the pixel data itself was also redrawn at some point since
    // this was last transcribed here, so both changed.
    // bg here is an editor-only visibility aid, not a real hardware trait -
    // it's a sprite, transparent in-game like every other 16x16 entry here.
    // Solid black on this tool's near-black grid/palette was reported
    // completely unreadable ("can't tell where it is to place it"), so it
    // gets the same sky-blue backdrop as the actual sky the game draws
    // behind it, purely so the black pixels have something to show against.
    enemy4: {
      size: 16,
      quads: {
        tl: [0, 0, 0, 0, 0, 0, 0, 0],
        bl: [0x30, 0x64, 0xFF, 0x07, 0x01, 0x2A, 0x15, 0x00],
        tr: [0, 0, 0, 0, 0, 0, 0, 0],
        br: [0x01, 0x06, 0x9C, 0xFF, 0xFE, 0x7C, 0x0E, 0x03]
      },
      color: "#000000",
      bg: "#5955e0"
    },
    // Enemy6's 0deg spin frame (NEWENEMY_PATTERN_TL/TR/BL/BR) - unlike every
    // other 16x16 entry here this is 4 BG tiles (2x2, not an MSX sprite), so
    // it's opaque like enemy3: FG gray on the same BG dark-blue. quads keyed
    // tl/bl/tr/br to match drawGlyph's paint offsets, values taken directly
    // from the ASM's DB bytes (TL/BL rows0-7 checked byte-for-byte against a
    // hand-drawn bit matrix that turned out to have several transcription
    // errors past row 2 - the ASM bytes are the ground truth, not the matrix).
    enemy6: {
      size: 16,
      quads: {
        tl: [0x00, 0x2A, 0x6A, 0x0A, 0x7A, 0x02, 0x7E, 0x00],
        bl: [0x7F, 0x03, 0x7F, 0x0F, 0x7F, 0x3F, 0x7F, 0x00],
        tr: [0x00, 0xAA, 0xAE, 0xAE, 0xBE, 0xBE, 0xFE, 0xFE],
        br: [0x7E, 0xBE, 0xDE, 0xEE, 0xF6, 0xFA, 0xFC, 0x00]
      },
      color: "#cccccc",
      bg: "#5955e0"
    },

    // ---- Stage2 roster (round32, "エディタをステージ2エネミーに対応")
    // ---- transcribed byte-for-byte from tools/stage2_combined's own
    // ---- generator scripts (enemy_gen.py/bigzum_gen.py/flyer_gen.py/
    // ---- etank_gen.py's own emit_asm_tables(), reproduced directly via
    // ---- `python3 -c "import X_gen; print(X_gen.emit_asm_tables())"`
    // ---- from tools/stage2_combined - NOT hand-transcribed from the ASM
    // ---- like the Stage1 glyphs above, since Stage2's own pattern bytes
    // ---- are themselves generated, not literal DB lines in combined_
    // ---- test.asm. Colors are this game's own hardware TMS9918 palette
    // ---- indices (0=transparent..15=white - confirmed against this
    // ---- exact file's own already-used hex, e.g. BOSS_TILES' "#db6559"
    // ---- red matches index8/medium-red exactly), not the differently-
    // ---- ordered "BASIC COLOR 1-16" numbering.
    // ZacoII (16x16, ENEMY_ZACOII) - light green, TMS9918 index3.
    s2_zacoii: {
      size: 16,
      quads: {
        tl: [6, 107, 206, 132, 49, 94, 237, 210],
        bl: [141, 35, 121, 240, 224, 88, 60, 14],
        tr: [48, 120, 60, 158, 71, 131, 97, 240],
        br: [224, 64, 144, 60, 114, 44, 30, 6]
      },
      color: "#74d07d"
    },
    // ZacoII red variant (same pattern/PAT_ZACO, E_VARIANT=1 - "10機出たら
    // 色替えの赤いZakoII"/"ZakoIIはの赤は速度３で"/"ZakoII赤の耐久２") -

  // Draws the boss's full 5x16-tile body at (x,y), top-left anchored, one grid
  // cell per 8x8 tile (cell must equal the caller's real 8px-per-cell CELL).
  function drawBossBody(ctx, x, y, cell) {
    for (var r = 0; r < BOSS_MAP.length; r++) {
      for (var c = 0; c < BOSS_MAP[r].length; c++) {
        var tx = x + c * cell, ty = y + r * cell;
        ctx.fillStyle = BOSS_BG;
        ctx.fillRect(tx, ty, cell, cell);
        var tile = BOSS_TILES[BOSS_MAP[r][c]];
        if (!tile) continue;
        ctx.fillStyle = tile.fg;
        var px = cell / 8, py = cell / 8;
        for (var rr = 0; rr < 8; rr++) {
          var byte = tile.rows[rr];
          for (var cc = 0; cc < 8; cc++) {
            if (byte & (0x80 >> cc)) {
              ctx.fillRect(tx + cc * px, ty + rr * py, Math.ceil(px) + 0.5, Math.ceil(py) + 0.5);
            }
          }
        }
      }
    }
  }

  // Stage2's own boss (Sasapi) placeholder - round32 scope call (see

  // (4x4-of-16x16 hw-sprite-quadrant) structure, considerably more

  // a plain labeled box at its real 8x8-cell/64x64px footprint instead

  // without needing to touch anything else here (footprintOf/drawGrid's
  // own s2_boss branches only care about the 8x8-cell size, not how
  // it's actually painted).
  function drawS2BossPlaceholder(ctx, x, y, cell) {
    var w = 8 * cell, h = 8 * cell;
    ctx.fillStyle = "#3a1116";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "#ff897d";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    ctx.fillStyle = "#ff897d";
    ctx.font = "700 " + Math.max(10, Math.round(cell * 1.4)) + "px " + tok("--font-mono").split(",")[0] + ", monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("BOSS", x + w / 2, y + h / 2);
  }

  // Draws a GLYPHS entry into ctx at (x,y), scaled to fill w x h. 8x8 "rows"
  // glyphs paint their bg first (opaque BG tile); 16x16 "quads" glyphs leave
  // 0-bits untouched (transparent sprite, like the real hardware); 32x32
  // "quadGroups" (round32, Stage2's own BigZum/Flyer/Etank - each is 4
  // real 16x16 hw sprites, not one bigger one) is just "quads" one level
  // deeper - tl/bl/tr/br, each itself a full quads{tl,bl,tr,br} group.
  function drawGlyph(ctx, glyph, x, y, w, h) {
    var n = glyph.size, px = w / n, py = h / n;
    if (glyph.bg) { ctx.fillStyle = glyph.bg; ctx.fillRect(x, y, w, h); }
    ctx.fillStyle = glyph.color;
    function paintRows(rows, offX, offY) {
      for (var r = 0; r < rows.length; r++) {
        var byte = rows[r];
        for (var c = 0; c < 8; c++) {
          if (byte & (0x80 >> c)) {
            ctx.fillRect(x + (offX + c) * px, y + (offY + r) * py, Math.ceil(px) + 0.5, Math.ceil(py) + 0.5);
          }
        }
      }
    }
    function paintQuads(quads, offX, offY) {
      paintRows(quads.tl, offX + 0, offY + 0);
      paintRows(quads.bl, offX + 0, offY + 8);
      paintRows(quads.tr, offX + 8, offY + 0);
      paintRows(quads.br, offX + 8, offY + 8);
    }
    if (glyph.rows) {
      paintRows(glyph.rows, 0, 0);
    } else if (glyph.quadGroups) {
      paintQuads(glyph.quadGroups.tl, 0, 0);
      paintQuads(glyph.quadGroups.bl, 0, 16);
      paintQuads(glyph.quadGroups.tr, 16, 0);
      paintQuads(glyph.quadGroups.br, 16, 16);
    } else {
      paintQuads(glyph.quads, 0, 0);
    }
  }

  var eraseArmed = false;

  // (see the currentMode checks at the top of each grid pointer handler).

  var lastCopiedText = "";

  var history = history1;

  // shared undo stack for both kinds of edit - painting terrain and

  // single place that unpacks one of these - every history.pop() site
  // below goes through it instead of feeding the popped value straight

  }

  }

      row: Math.max(0, Math.min(row, ROWS - 16))

  // real body size) placeholder box rather than a pixel-perfect body.
  function s2BossOrigin(tick, row) {
    return {
      tick: Math.max(0, Math.min(tick, MAX_TICK - 8)),
      row: Math.max(0, Math.min(row, ROWS - 8))

  }

  // exactly 1 cell, every 16x16 sprite is 2x2 cells, every 32x32 sprite
  // (round32: Stage2's own BigZum/Flyer/Etank) is 4x4 cells, Stage1's own
  // boss is its full 5x16 body, Stage2's own boss (s2_boss) is an 8x8
