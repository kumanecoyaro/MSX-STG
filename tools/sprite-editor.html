<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER_SUZUKA — Sprite Editor</title>
<style>
  :root {
    --bg: #05080d;
    --surface: #0b1220;
    --surface-2: #0e1626;
    --line: #17233a;
    --grid-line: #1a2f52;
    --grid-line-strong: #2c58a0;
    --ink: #eaf1fb;
    --ink-dim: #7f93ad;
    --ink-faint: #4c5f7d;
    --accent: #4fd2ff;
    --accent-ink: #04141c;
    --danger: #ff5d6c;
    --danger-ink: #260607;
    --ok: #6bdc7c;
    --warn: #ffd166;

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    overscroll-behavior: none;
    /* pan-y (not none) - a horizontal swipe is what the browser reads as
       "swipe back", but the sidebar still needs to scroll vertically. This
       only affects panning/navigation gestures, not taps, so buttons near
       the screen edge are unaffected. */
    touch-action: pan-y;
  }

  body {
    display: flex;
    flex-direction: row;
    height: 100vh;
    height: 100dvh;
  }

  button, .btn-label {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.01em;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    padding: 0 4px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease, transform 80ms ease;
    white-space: nowrap;
  }
  button:disabled, .btn-label.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
  }
  .btn-label {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    user-select: none;
  }
  button:hover:not(:disabled), .btn-label:hover { border-color: var(--ink-faint); }
  button:active:not(:disabled), .btn-label:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.armed {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px var(--accent);
  }
  button.active-mode {
    background: var(--warn);
    color: #111;
    border-color: var(--warn);
  }

  /* ---------- pixel grid (left) ---------- */
  .gridwrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    padding: 2px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .grid-panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    width: auto;
    max-height: 100%;
    margin: 0 auto;
  }

  /* サイズ切り替えボタンエリア */
  .size-selector {
    display: flex;
    gap: 2px;
    width: 100%;
    justify-content: center;
  }
  .size-btn {
    flex: 1;
    padding: 2px 2px;
    font-size: 10px;
  }
  .size-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  /* フレーム切り替えボタンエリア（左右1234右の6列） */
  .frame-selector {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    width: 100%;
    margin-top: 2px;
  }
  .frame-btn {
    width: 100%;
    padding: 4px 0;
    font-size: 11px;
    text-align: center;
  }
  .frame-btn.active {
    background: var(--ok) !important;
    color: var(--surface) !important;
    border-color: var(--ok) !important;
    font-weight: bold;
  }
  .frame-btn.nav-btn {
    font-weight: bold;
    background: var(--surface);
  }

  /* キャンバス表示領域とズーム対応ビューポート */
  .grid-viewport {
    width: var(--grid-size, 300px);
    height: var(--grid-size, 300px);
    border: 2px solid var(--grid-line-strong);
    margin-top: 2px;
    margin-bottom: 12px;
    overflow: hidden;
    position: relative;
    touch-action: none;
    user-select: none;
  }

  .grid {
    display: grid;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    position: relative;
    box-sizing: border-box;
    transform-origin: 0 0;
  }
  .cell {
    border: 1px solid var(--grid-line);
    background: #000;
    cursor: crosshair;
    position: relative;
    box-sizing: border-box;
  }
  .cell.qdiv-right { border-right: 2px solid var(--grid-line-strong); }
  .cell.qdiv-bottom { border-bottom: 2px solid var(--grid-line-strong); }

  /* 外枠ハイライト */
  .cell.sel-top { border-top: 2px dashed var(--accent) !important; }
  .cell.sel-bottom { border-bottom: 2px dashed var(--accent) !important; }
  .cell.sel-left { border-left: 2px dashed var(--accent) !important; }
  .cell.sel-right { border-right: 2px dashed var(--accent) !important; }

  .cell.pst-top { border-top: 2px solid var(--warn) !important; }
  .cell.pst-bottom { border-bottom: 2px solid var(--warn) !important; }
  .cell.pst-left { border-left: 2px solid var(--warn) !important; }
  .cell.pst-right { border-right: 2px solid var(--warn) !important; }

  /* Checkerboard */
  .transparent-swatch {
    background-image:
      linear-gradient(45deg, #666 25%, transparent 25%),
      linear-gradient(-45deg, #666 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #666 75%),
      linear-gradient(-45deg, transparent 75%, #666 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
    background-color: #222;
  }

  /* ---------- right sidebar ---------- */
  aside {
    flex: 0 0 260px;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .side-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .side-section:last-child { border-bottom: none; }

  .btn-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
  }
  .btn-row-2 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
    margin-top: 6px;
  }
  .btn-row button, .btn-row .btn-label,
  .btn-row-2 button {
    height: 32px;
    width: 100%;
  }

  .color-target-row { display: flex; gap: 6px; }
  .color-target {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 8px 0 6px;
  }
  .mini-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid var(--ink-faint);
    flex: 0 0 auto;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 4px;
    margin-top: 8px;
  }
  .swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 5px;
    border: 2px solid var(--line);
    padding: 0;
    cursor: pointer;
  }
  .swatch:hover { border-color: var(--ink-faint); }
  .swatch.armed-fg { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .swatch.armed-bg { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }

  #liveMsg {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 8px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 14px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease, transform 160ms ease;
    z-index: 20;
    max-width: min(70vw, 480px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #liveMsg.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 8, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay-card {
    width: min(320px, 100%);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .overlay-title { font-size: 13px; font-weight: 600; }
  #saveFilenameInput, #textPasteInput {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 15px;
  }
  #textPasteInput {
    width: 100%;
    height: 140px;
    resize: vertical;
    font-size: 14px;
    line-height: 1.4;
  }
  .overlay-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .overlay-actions button { padding: 8px 14px; }
  .overlay-status { font-size: 11.5px; color: var(--danger); min-height: 1.2em; }
  .overlay-status.ok { color: var(--ok); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .gridwrap { flex: 0 0 auto; height: auto; padding: 8px; }
    aside { flex: 1 1 auto; height: auto; border-left: none; border-top: 1px solid var(--line); }
  }
</style>

<body>
  <div class="gridwrap">
    <div class="grid-panel">
      <!-- サイズ切り替えボタンエリア（5つ） -->
      <div class="size-selector" id="sizeSelector">
        <button class="size-btn" data-size="8">8x8</button>
        <button class="size-btn active" data-size="16">16x16</button>
        <button class="size-btn" data-size="24">24x24</button>
        <button class="size-btn" data-size="32">32x32</button>
        <button class="size-btn" data-size="64">64x64</button>
      </div>

      <div class="grid-viewport" id="gridViewport">
        <div class="grid" id="grid"></div>
      </div>

      <!-- フレーム切り替えボタンエリア（左右1234右の6列） -->
      <div class="frame-selector" id="frameSelector">
        <button class="frame-btn nav-btn" data-nav="-1">&lt;</button>
        <button class="frame-btn page-btn active" data-frame="0">1</button>
        <button class="frame-btn page-btn" data-frame="1">2</button>
        <button class="frame-btn page-btn" data-frame="2">3</button>
        <button class="frame-btn page-btn" data-frame="3">4</button>
        <button class="frame-btn nav-btn" data-nav="1">&gt;</button>
      </div>
    </div>
  </div>

  <aside>
    <div class="side-section">
      <!-- 1行目: Load JSON, Copy, Paste, Undo (4列) -->
      <div class="btn-row">
        <label class="btn-label" for="fileInput">Load Json</label>
        <input type="file" id="fileInput" accept=".json" hidden>
        <button id="btnCopy">Copy</button>
        <button id="btnPaste">Paste</button>
        <button id="btnUndo" disabled>Undo</button>
      </div>
      <!-- 2行目: Save Json, Copy 0/1, Paste 0/1, 4倍表示 (4列) -->
      <div class="btn-row-2">
        <button class="primary" id="btnSave">Save Json</button>
        <button id="btnCopyText">Copy 0/1</button>
        <button id="btnPasteText">Paste 0/1</button>
        <button id="btnZoom" disabled>4倍表示</button>
      </div>
    </div>

    <div class="side-section">
      <div class="color-target-row">
        <button class="color-target" id="btnBgColor"><span class="mini-swatch" id="bgSwatch"></span>背景色</button>
        <button class="color-target" id="btnFgColor"><span class="mini-swatch" id="fgSwatch"></span>文字色</button>
      </div>
      <div class="palette" id="palette"></div>
    </div>
  </aside>

  <div id="liveMsg"></div>

  <div id="saveOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-title">Save as</div>
      <input type="text" id="saveFilenameInput" value="Sprite.json">
      <div class="overlay-status" id="saveStatus"></div>
      <div class="overlay-actions">
        <button id="btnSaveCancel">Cancel</button>
        <button id="btnSaveCopy">Copy JSON</button>
        <button class="primary" id="btnSaveConfirm">Save</button>
      </div>
    </div>
  </div>

  <!-- Paste 0/1用ウィンドウ -->
  <div id="textPasteOverlay" class="overlay">
    <div class="overlay-card">
      <div class="overlay-title">Paste 0/1 (全角)</div>
      <textarea id="textPasteInput" placeholder="全角０１で入力または貼り付け"></textarea>
      <div class="overlay-status" id="textPasteStatus"></div>
      <div class="overlay-actions">
        <button id="btnTextPasteCancel">Cancel</button>
        <button class="primary" id="btnTextPasteConfirm">OK</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var GRID_N = 16; // デフォルトサイズ
  var NUM_FRAMES = 4;
  var currentFrame = 0;

  // ---------- real MSX1 (TMS9918) 16-color palette ----------
  var MSX_PALETTE = [
    { i: 0,  name: "透明",   hex: null },
    { i: 1,  name: "黒",     hex: "#000000" },
    { i: 2,  name: "緑",     hex: "#3eb849" },
    { i: 3,  name: "黄緑",   hex: "#74d07d" },
    { i: 4,  name: "濃紺",   hex: "#5955e0" },
    { i: 5,  name: "青",     hex: "#8076f1" },
    { i: 6,  name: "暗赤",   hex: "#b95e51" },
    { i: 7,  name: "水色",   hex: "#65dbef" },
    { i: 8,  name: "赤",     hex: "#db6559" },
    { i: 9,  name: "明るい赤", hex: "#ff897d" },
    { i: 10, name: "黄土色", hex: "#ccc35e" },
    { i: 11, name: "黄",     hex: "#ded087" },
    { i: 12, name: "暗緑",   hex: "#3aa241" },
    { i: 13, name: "紫",     hex: "#b766b5" },
    { i: 14, name: "灰",     hex: "#cccccc" },
    { i: 15, name: "白",     hex: "#ffffff" }
  ];

  // ---------- state ----------
  var frames = [];
  var fgIndices = [15, 15, 15, 15]; // 各フレームごとの文字色
  var bgIndices = [1, 1, 1, 1];     // 各フレームごとの背景色
  var armedColorTarget = null;

  // Modes: "draw" | "copy_select" | "paste_preview"
  var currentMode = "draw";
  var selectionStart = null; // {r, c}
  var selectionEnd = null;   // {r, c}
  var lastCopiedText = "";   // 直近でコピーしたテキスト
  var pasteData = null;      // 2D boolean array
  var pastePos = { r: 0, c: 0 }; // 貼り付け位置左上

  // Zoom / Pan state
  var isZoomed = false;
  var panX = 0;
  var panY = 0;

  function initBits(size) {
    var b = [];
    for (var ri = 0; ri < size; ri++) b.push(new Array(size).fill(false));
    return b;
  }

  function initAllFrames(size) {
    var f = [];
    for (var i = 0; i < NUM_FRAMES; i++) f.push(initBits(size));
    return f;
  }

  frames = initAllFrames(GRID_N);

  function getFrameSize(fIdx) {
    return frames[fIdx] ? frames[fIdx].length : GRID_N;
  }

  function isCurrentFrameEdited() {
    var cur = frames[currentFrame];
    var size = cur.length;
    for (var r = 0; r < size; r++) {
      for (var c = 0; c < size; c++) {
        if (cur[r][c]) return true;
      }
    }
    return false;
  }

  function updateSizeButtonsState() {
    var edited = isCurrentFrameEdited();
    var btns = document.querySelectorAll(".size-btn");
    btns.forEach(function (btn) {
      var size = parseInt(btn.dataset.size, 10);
      btn.classList.toggle("active", size === GRID_N);
      btn.disabled = edited && size !== GRID_N;
    });
  }

  function updateFrameButtonsState() {
    var btns = document.querySelectorAll(".page-btn");
    btns.forEach(function (btn) {
      var frameIdx = parseInt(btn.dataset.frame, 10);
      btn.classList.toggle("active", frameIdx === currentFrame);
    });
  }

  function updateZoomButtonState() {
    var btnZoom = document.getElementById("btnZoom");
    var canZoom = (GRID_N === 32 || GRID_N === 64);
    if (!canZoom && isZoomed) {
      resetZoom();
    }
    btnZoom.disabled = !canZoom;
    btnZoom.classList.toggle("active-mode", isZoomed);
  }

  function colorHex(i) {
    var c = MSX_PALETTE[i];
    return c ? c.hex : null;
  }

  function paintSwatchEl(el, idx) {
    var hex = colorHex(idx);
    if (hex) {
      el.style.background = hex;
      el.classList.remove("transparent-swatch");
    } else {
      el.style.background = "";
      el.classList.add("transparent-swatch");
    }
  }

  // ---------- undo ----------
  var history = [];
  var MAX_HISTORY = 50;
  var btnUndo = document.getElementById("btnUndo");

  function pushHistory() {
    var framesCopy = frames.map(function(f) {
      return f.map(function(row) { return row.slice(); });
    });
    history.push({
      gridN: GRID_N,
      frames: framesCopy,
      currentFrame: currentFrame,
      fgs: fgIndices.slice(), // カラー情報もコピーして保存
      bgs: bgIndices.slice()
    });
    if (history.length > MAX_HISTORY) history.shift();
    btnUndo.disabled = false;
  }

  function undo() {
    if (!history.length) return;
    exitSpecialModes();
    var snap = history.pop();
    frames = snap.frames;
    currentFrame = snap.currentFrame;
    GRID_N = getFrameSize(currentFrame);
    fgIndices = snap.fgs;
    bgIndices = snap.bgs;
    btnUndo.disabled = history.length === 0;

    buildGridDOM();
    renderAll();
    fitGrid();
    flash("undo");
  }

  btnUndo.addEventListener("click", undo);
  window.addEventListener("keydown", function (ev) {
    if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && ev.key.toLowerCase() === "z") {
      ev.preventDefault();
      undo();
    }
  });

  // ---------- grid DOM & Zoom / Pan ----------
  var gridEl = document.getElementById("grid");
  var gridViewportEl = document.getElementById("gridViewport");
  var cellEls = [];

  function updateTransform() {
    if (isZoomed) {
      var vpSize = gridViewportEl.clientWidth;
      var maxPan = vpSize * 1; // 2x2（4倍）表示で食い出る移動上限
      panX = Math.max(-maxPan, Math.min(0, panX));
      panY = Math.max(-maxPan, Math.min(0, panY));
      gridEl.style.transform = "translate(" + panX + "px, " + panY + "px) scale(2)";
    } else {
      panX = 0;
      panY = 0;
      gridEl.style.transform = "none";
    }
  }

  function resetZoom() {
    isZoomed = false;
    panX = 0;
    panY = 0;
    updateTransform();
    updateZoomButtonState();
  }

  function toggleZoom() {
    if (GRID_N !== 32 && GRID_N !== 64) return;
    isZoomed = !isZoomed;
    if (isZoomed) {
      // ズームON時は中央部分を初期表示にする
      var vpSize = gridViewportEl.clientWidth;
      panX = -vpSize * 0.5;
      panY = -vpSize * 0.5;
    } else {
      panX = 0;
      panY = 0;
    }
    updateTransform();
    updateZoomButtonState();
  }

  document.getElementById("btnZoom").addEventListener("click", toggleZoom);

  function buildGridDOM() {
    gridEl.innerHTML = "";
    gridEl.style.gridTemplateColumns = "repeat(" + GRID_N + ", 1fr)";
    gridEl.style.gridTemplateRows = "repeat(" + GRID_N + ", 1fr)";
    cellEls = [];

    for (var r = 0; r < GRID_N; r++) {
      cellEls.push([]);
      for (var c = 0; c < GRID_N; c++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        if ((c + 1) % 8 === 0 && c !== GRID_N - 1) cell.classList.add("qdiv-right");
        if ((r + 1) % 8 === 0 && r !== GRID_N - 1) cell.classList.add("qdiv-bottom");
        cell.dataset.r = r;
        cell.dataset.c = c;
        gridEl.appendChild(cell);
        cellEls[r].push(cell);
      }
    }
    updateTransform();
  }

  function changeSize(newSize) {
    if (newSize === GRID_N) return;
    if (isCurrentFrameEdited()) {
      flash("現在のフレームが編集中のためサイズ変更できません");
      return;
    }
    exitSpecialModes();
    GRID_N = newSize;
    frames[currentFrame] = initBits(GRID_N);
    pushHistory();
    buildGridDOM();
    fitGrid();
    renderAll();
  }

  document.getElementById("sizeSelector").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".size-btn");
    if (!btn || btn.disabled) return;
    var size = parseInt(btn.dataset.size, 10);
    changeSize(size);
  });

  document.getElementById("frameSelector").addEventListener("click", function (ev) {
    var btn = ev.target.closest(".frame-btn");
    if (!btn) return;
    exitSpecialModes();

    if (btn.classList.contains("page-btn")) {
      currentFrame = parseInt(btn.dataset.frame, 10);
    } else if (btn.classList.contains("nav-btn")) {
      var dir = parseInt(btn.dataset.nav, 10);
      currentFrame = (currentFrame + dir + NUM_FRAMES) % NUM_FRAMES;
    }

    GRID_N = getFrameSize(currentFrame);
    buildGridDOM();
    renderAll();
    fitGrid();
    flash("Frame " + (currentFrame + 1));
  });

  function renderCell(r, c) {
    if (!cellEls[r] || !cellEls[r][c]) return;
    var el = cellEls[r][c];
    var val = frames[currentFrame][r][c];

    if (currentMode === "paste_preview" && pasteData) {
      var pr = r - pastePos.r;
      var pc = c - pastePos.c;
      if (pr >= 0 && pr < pasteData.length && pc >= 0 && pc < pasteData[0].length) {
        val = pasteData[pr][pc];
      }
    }

    var hex = colorHex(val ? fgIndices[currentFrame] : bgIndices[currentFrame]);
    if (hex) {
      el.style.background = hex;
      el.classList.remove("transparent-swatch");
    } else {
      el.style.background = "";
      el.classList.add("transparent-swatch");
    }

    el.classList.remove("sel-top", "sel-bottom", "sel-left", "sel-right");
    el.classList.remove("pst-top", "pst-bottom", "pst-left", "pst-right");

    if (currentMode === "copy_select" && selectionStart && selectionEnd) {
      var minR = Math.min(selectionStart.r, selectionEnd.r);
      var maxR = Math.max(selectionStart.r, selectionEnd.r);
      var minC = Math.min(selectionStart.c, selectionEnd.c);
      var maxC = Math.max(selectionStart.c, selectionEnd.c);

      if (r >= minR && r <= maxR && c >= minC && c <= maxC) {
        if (r === minR) el.classList.add("sel-top");
        if (r === maxR) el.classList.add("sel-bottom");
        if (c === minC) el.classList.add("sel-left");
        if (c === maxC) el.classList.add("sel-right");
      }
    }

    if (currentMode === "paste_preview" && pasteData) {
      var pMinR = pastePos.r;
      var pMaxR = pastePos.r + pasteData.length - 1;
      var pMinC = pastePos.c;
      var pMaxC = pastePos.c + pasteData[0].length - 1;

      if (r >= pMinR && r <= pMaxR && c >= pMinC && c <= pMaxC) {
        if (r === pMinR) el.classList.add("pst-top");
        if (r === pMaxR) el.classList.add("pst-bottom");
        if (c === pMinC) el.classList.add("pst-left");
        if (c === pMaxC) el.classList.add("pst-right");
      }
    }
  }

  function updateColorTargetButtons() {
    btnBgColor.classList.toggle("armed", armedColorTarget === "bg");
    btnFgColor.classList.toggle("armed", armedColorTarget === "fg");
    paintSwatchEl(bgSwatchEl, bgIndices[currentFrame]);
    paintSwatchEl(fgSwatchEl, fgIndices[currentFrame]);
  }

  function updatePaletteHighlight() {
    Array.prototype.forEach.call(paletteEl.children, function (el) {
      var idx = +el.dataset.i;
      el.classList.toggle("armed-fg", idx === fgIndices[currentFrame]);
      el.classList.toggle("armed-bg", idx === bgIndices[currentFrame]);
    });
  }

  var ZEN_DIGIT = { "0": "０", "1": "１" };

  function outputFullText() {
    return frames[currentFrame].map(function (row) {
      return row.map(function (v) { return ZEN_DIGIT[v ? "1" : "0"]; }).join("");
    }).join("\n");
  }

  function getSelectedText() {
    var minR = 0, maxR = GRID_N - 1, minC = 0, maxC = GRID_N - 1;
    if (selectionStart && selectionEnd) {
      minR = Math.min(selectionStart.r, selectionEnd.r);
      maxR = Math.max(selectionStart.r, selectionEnd.r);
      minC = Math.min(selectionStart.c, selectionEnd.c);
      maxC = Math.max(selectionStart.c, selectionEnd.c);
    }
    var lines = [];
    for (var r = minR; r <= maxR; r++) {
      var rowStr = "";
      for (var c = minC; c <= maxC; c++) {
        rowStr += ZEN_DIGIT[frames[currentFrame][r][c] ? "1" : "0"];
      }
      lines.push(rowStr);
    }
    return lines.join("\n");
  }

  function renderAll() {
    for (var rr = 0; rr < GRID_N; rr++) {
      for (var cc = 0; cc < GRID_N; cc++) {
        renderCell(rr, cc);
      }
    }
    updateColorTargetButtons();
    updatePaletteHighlight();
    updateSizeButtonsState();
    updateFrameButtonsState();
    updateZoomButtonState();

    btnCopy.classList.toggle("active-mode", currentMode === "copy_select");
    btnPaste.classList.toggle("active-mode", currentMode === "paste_preview");
  }

  function exitSpecialModes() {
    currentMode = "draw";
    selectionStart = null;
    selectionEnd = null;
    pasteData = null;
    renderAll();
  }

  // ---------- color target buttons + palette ----------
  var btnBgColor = document.getElementById("btnBgColor");
  var btnFgColor = document.getElementById("btnFgColor");
  var bgSwatchEl = document.getElementById("bgSwatch");
  var fgSwatchEl = document.getElementById("fgSwatch");
  var paletteEl = document.getElementById("palette");

  btnBgColor.addEventListener("click", function () {
    armedColorTarget = armedColorTarget === "bg" ? null : "bg";
    updateColorTargetButtons();
  });
  btnFgColor.addEventListener("click", function () {
    armedColorTarget = armedColorTarget === "fg" ? null : "fg";
    updateColorTargetButtons();
  });

  MSX_PALETTE.forEach(function (col) {
    var sw = document.createElement("button");
    sw.className = "swatch";
    sw.dataset.i = col.i;
    sw.title = col.i + ": " + col.name;
    paintSwatchEl(sw, col.i);
    sw.addEventListener("click", function () {
      if (!armedColorTarget) {
        flash("先に背景色か文字色のボタンを選んでください");
        return;
      }
      pushHistory();
      if (armedColorTarget === "fg") {
        fgIndices[currentFrame] = col.i;
      } else {
        bgIndices[currentFrame] = col.i;
      }
      armedColorTarget = null;
      renderAll();
    });
    paletteEl.appendChild(sw);
  });

  // ---------- drawing & drag pointer / multi-touch pan handlers ----------
  var paintValue = null;
  var paintPointerId = null;
  var dragStartPos = null;
  var activePointers = new Map();
  var isPanning = false;
  var cancelCurrentAction = false;
  var lastPanCenter = null;

  function cellAtPoint(x, y) {
    var el = document.elementFromPoint(x, y);
    var cell = el && el.closest ? el.closest(".cell") : null;
    if (!cell || !gridEl.contains(cell)) return null;
    return { r: +cell.dataset.r, c: +cell.dataset.c };
  }

  function paintCell(r, c, value) {
    if (frames[currentFrame][r][c] === value) return;
    frames[currentFrame][r][c] = value;
    renderCell(r, c);
    updateSizeButtonsState();
  }

  function getPointersCenter() {
    var pts = Array.from(activePointers.values());
    if (pts.length < 2) return null;
    return {
      x: (pts[0].x + pts[1].x) / 2,
      y: (pts[0].y + pts[1].y) / 2
    };
  }

  function abortPaint() {
    if (paintPointerId !== null && currentMode === "draw") {
      // 2本指操作が入った瞬間に直前の1ピクセル打画履歴をロールバック
      if (history.length > 0) {
        var snap = history.pop();
        frames = snap.frames;
        fgIndices = snap.fgs;
        bgIndices = snap.bgs;
        btnUndo.disabled = history.length === 0;
        renderAll();
      }
    }
    paintPointerId = null;
    paintValue = null;
    dragStartPos = null;
  }

  gridViewportEl.addEventListener("pointerdown", function (ev) {
    activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

    // 2本指以上のタッチ操作が入った場合、パンモードに移行
    if (activePointers.size >= 2) {
      if (!isPanning) {
        isPanning = true;
        cancelCurrentAction = true; // 2本指スワイプ中〜全指解放までは描画ガード
        abortPaint();
      }
      lastPanCenter = getPointersCenter();
      return;
    }

    if (cancelCurrentAction) return;

    var hit = cellAtPoint(ev.clientX, ev.clientY);
    if (!hit) return;

    paintPointerId = ev.pointerId;

    if (currentMode === "draw") {
      pushHistory();
      paintValue = !frames[currentFrame][hit.r][hit.c];
      paintCell(hit.r, hit.c, paintValue);
    } else if (currentMode === "copy_select") {
      selectionStart = hit;
      selectionEnd = hit;
      renderAll();
    } else if (currentMode === "paste_preview") {
      dragStartPos = hit;
    }
  });

  gridViewportEl.addEventListener("pointermove", function (ev) {
    if (activePointers.has(ev.pointerId)) {
      activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    }

    // 2本指以上でのパン処理（拡大表示時のみ追従移動）
    if (activePointers.size >= 2) {
      if (!isPanning) {
        isPanning = true;
        cancelCurrentAction = true;
        abortPaint();
      }
      if (isZoomed) {
        var center = getPointersCenter();
        if (center && lastPanCenter) {
          var dx = center.x - lastPanCenter.x;
          var dy = center.y - lastPanCenter.y;
          panX += dx;
          panY += dy;
          updateTransform();
        }
        lastPanCenter = center;
      }
      return;
    }

    if (cancelCurrentAction || paintPointerId === null || ev.pointerId !== paintPointerId) return;
    var hit = cellAtPoint(ev.clientX, ev.clientY);
    if (!hit) return;

    if (currentMode === "draw") {
      paintCell(hit.r, hit.c, paintValue);
    } else if (currentMode === "copy_select") {
      selectionEnd = hit;
      renderAll();
    } else if (currentMode === "paste_preview" && dragStartPos) {
      var dr = hit.r - dragStartPos.r;
      var dc = hit.c - dragStartPos.c;
      pastePos.r += dr;
      pastePos.c += dc;
      dragStartPos = hit;
      renderAll();
    }
  });

  function endPointer(ev) {
    activePointers.delete(ev.pointerId);

    if (activePointers.size < 2) {
      isPanning = false;
      lastPanCenter = null;
    }

    // 画面から指がすべて離れたらガード解除
    if (activePointers.size === 0) {
      cancelCurrentAction = false;
    }

    if (paintPointerId === ev.pointerId) {
      paintPointerId = null;
      paintValue = null;
      dragStartPos = null;
    }
  }

  gridViewportEl.addEventListener("pointerup", endPointer);
  gridViewportEl.addEventListener("pointercancel", endPointer);

  // ---------- Copy 0/1 ----------
  document.getElementById("btnCopyText").addEventListener("click", function () {
    exitSpecialModes();
    var text = outputFullText();
    copyToClipboard(text, "Frame " + (currentFrame + 1) + " (0/1) をコピーしました");
  });

  // ---------- Paste 0/1 ----------
  var textPasteOverlay = document.getElementById("textPasteOverlay");
  var textPasteInput = document.getElementById("textPasteInput");
  var textPasteStatus = document.getElementById("textPasteStatus");

  document.getElementById("btnPasteText").addEventListener("click", function () {
    exitSpecialModes();
    textPasteStatus.textContent = "";
    textPasteInput.value = "";
    textPasteOverlay.classList.add("show");
    textPasteInput.focus();
  });

  function doTextPaste() {
    var text = textPasteInput.value;
    var pData = parsePatternText(text);
    if (!pData) {
      textPasteStatus.textContent = "有効な全角0/1データがありません";
      return;
    }

    pushHistory();
    for (var pr = 0; pr < pData.length; pr++) {
      for (var pc = 0; pc < pData[0].length; pc++) {
        if (pr < GRID_N && pc < GRID_N) {
          frames[currentFrame][pr][pc] = pData[pr][pc];
        }
      }
    }
    textPasteOverlay.classList.remove("show");
    renderAll();
    flash("Paste 0/1 を完了しました");
  }

  document.getElementById("btnTextPasteCancel").addEventListener("click", function () {
    textPasteOverlay.classList.remove("show");
  });
  document.getElementById("btnTextPasteConfirm").addEventListener("click", doTextPaste);
  textPasteOverlay.addEventListener("click", function (ev) {
    if (ev.target === textPasteOverlay) textPasteOverlay.classList.remove("show");
  });

  // ---------- Copy ----------
  var btnCopy = document.getElementById("btnCopy");
  btnCopy.addEventListener("click", function () {
    if (currentMode !== "copy_select") {
      currentMode = "copy_select";
      selectionStart = { r: 0, c: 0 };
      selectionEnd = { r: GRID_N - 1, c: GRID_N - 1 };
      renderAll();
      flash("範囲を選択し、もう一度Copyで確定");
    } else {
      var text = getSelectedText();
      lastCopiedText = text;
      copyToClipboard(text, "選択範囲をコピーしました");
      exitSpecialModes();
    }
  });

  function copyToClipboard(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flash(successMsg); },
        function () { copyViaTempTextarea(text, successMsg); }
      );
    } else {
      copyViaTempTextarea(text, successMsg);
    }
  }

  function copyViaTempTextarea(text, successMsg) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    flash(ok ? successMsg : "コピーできませんでした");
  }

  // ---------- Paste ----------
  var btnPaste = document.getElementById("btnPaste");
  btnPaste.addEventListener("click", function () {
    if (currentMode !== "paste_preview") {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (clipText) {
          initPastePreview(clipText || lastCopiedText);
        }).catch(function () {
          initPastePreview(lastCopiedText);
        });
      } else {
        initPastePreview(lastCopiedText);
      }
    } else {
      if (pasteData) {
        pushHistory();
        for (var pr = 0; pr < pasteData.length; pr++) {
          for (var pc = 0; pc < pasteData[0].length; pc++) {
            var targetR = pastePos.r + pr;
            var targetC = pastePos.c + pc;
            if (targetR >= 0 && targetR < GRID_N && targetC >= 0 && targetC < GRID_N) {
              frames[currentFrame][targetR][targetC] = pasteData[pr][pc];
            }
          }
        }
        flash("ペーストを確定しました");
      }
      exitSpecialModes();
    }
  });

  function parsePatternText(text) {
    if (!text) return null;
    var lines = text.trim().split(/\r?\n/);
    if (!lines.length) return null;
    var grid = [];
    for (var i = 0; i < lines.length; i++) {
      var row = [];
      var line = lines[i];
      for (var j = 0; j < line.length; j++) {
        var ch = line[j];
        if (ch === "１" || ch === "1") row.push(true);
        else if (ch === "０" || ch === "0") row.push(false);
      }
      if (row.length > 0) grid.push(row);
    }
    return grid.length > 0 ? grid : null;
  }

  function initPastePreview(text) {
    var pData = parsePatternText(text);
    if (!pData) {
      flash("ペーストできる有効なデータがありません");
      return;
    }
    currentMode = "paste_preview";
    pasteData = pData;
    pastePos = { r: 0, c: 0 };
    renderAll();
    flash("位置を合わせて、もう一度Pasteで確定");
  }

  // ---------- save / load ----------
  function currentJSON() {
    var curFrameBits = frames[currentFrame].map(function (row) {
      return row.map(function (v) { return v ? 1 : 0; });
    });

    return JSON.stringify({
      version: 2,
      game: "CYBER_SUZUKA",
      width: GRID_N,
      height: GRID_N,
      fg: fgIndices[currentFrame],
      bg: bgIndices[currentFrame],
      bits: curFrameBits
    }, null, 2);
  }

  var saveOverlay = document.getElementById("saveOverlay");
  var saveFilenameInput = document.getElementById("saveFilenameInput");
  var saveStatus = document.getElementById("saveStatus");

  // window.claude only ever exposes use() - there's no window.claude.downloads
  // property to feature-check. Resolve the namespace once at boot and cache
  // it; doSave()'s fallback chain just reads the cached value (null until
  // resolved, or forever if this view can't run the capability).
  var downloadsCap = null;
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (cap) { downloadsCap = cap; });
  }

  document.getElementById("btnSave").addEventListener("click", function () {
    saveStatus.textContent = "";
    saveStatus.classList.remove("ok");
    saveFilenameInput.value = "Sprite_" + GRID_N + "x" + GRID_N + ".json";
    saveOverlay.classList.add("show");
    saveFilenameInput.focus();

    var selLen = "Sprite".length;
    if (saveFilenameInput.setSelectionRange) {
      saveFilenameInput.setSelectionRange(0, selLen);
    } else {
      saveFilenameInput.select();
    }
  });

  function doSaveViaBlobLink(filename, jsonStr) {
    try {
      var blob = new Blob([jsonStr], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 100);
      saveOverlay.classList.remove("show");
      flash("saved " + filename);
    } catch (err) {
      saveStatus.textContent = "save failed";
      saveStatus.classList.remove("ok");
    }
  }

  function doSaveViaDownloadsCapability(filename, jsonStr) {
    downloadsCap.save({ filename: filename, data: jsonStr }).then(
      function () {
        saveOverlay.classList.remove("show");
        flash("saved " + filename);
      },
      function (err) {
        if (err && err.code === "declined") { saveOverlay.classList.remove("show"); flash("save cancelled"); return; }
        saveStatus.textContent = "save failed";
        saveStatus.classList.remove("ok");
      }
    );
  }

  function doSaveViaDownloadOrBlob(filename, jsonStr) {
    if (downloadsCap) {
      doSaveViaDownloadsCapability(filename, jsonStr);
    } else {
      doSaveViaBlobLink(filename, jsonStr);
    }
  }

  function doSave() {
    var filename = saveFilenameInput.value.trim() || ("Sprite_" + GRID_N + "x" + GRID_N + ".json");
    var jsonStr = currentJSON();

    var file = null;
    try { file = new File([jsonStr], filename, { type: "application/json" }); } catch (e) {}
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).then(
        function () {
          saveOverlay.classList.remove("show");
          flash("saved " + filename);
        },
        function (err) {
          if (err && err.name === "AbortError") { saveOverlay.classList.remove("show"); flash("save cancelled"); return; }
          doSaveViaDownloadOrBlob(filename, jsonStr);
        }
      );
      return;
    }

    doSaveViaDownloadOrBlob(filename, jsonStr);
  }

  document.getElementById("btnSaveCancel").addEventListener("click", function () {
    saveOverlay.classList.remove("show");
  });
  document.getElementById("btnSaveCopy").addEventListener("click", function () {
    copyToClipboard(currentJSON(), "JSONをコピーしました（ファイルに貼り付けて保存してください）");
  });
  document.getElementById("btnSaveConfirm").addEventListener("click", doSave);
  saveFilenameInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") doSave();
    if (ev.key === "Escape") saveOverlay.classList.remove("show");
  });
  saveOverlay.addEventListener("click", function (ev) {
    if (ev.target === saveOverlay) saveOverlay.classList.remove("show");
  });

  function importJSONText(text) {
    var data = JSON.parse(text);
    var size = data.width || 16;
    if (![8, 16, 24, 32, 64].includes(size)) throw new Error("unsupported size");

    var loadedTargetFrame = null;
    if (data.bits && Array.isArray(data.bits) && data.bits.length === size) {
      loadedTargetFrame = data.bits.map(function(row) {
        if (!Array.isArray(row) || row.length !== size) throw new Error("invalid row length");
        return row.map(function(v) { return !!v; });
      });
    } else if (data.frames && Array.isArray(data.frames) && data.frames.length > 0) {
      var frameData = data.frames[0];
      if (!Array.isArray(frameData) || frameData.length !== size) throw new Error("invalid frame array");
      loadedTargetFrame = frameData.map(function(row) {
        if (!Array.isArray(row) || row.length !== size) throw new Error("invalid row length");
        return row.map(function(v) { return !!v; });
      });
    } else {
      throw new Error("invalid data format");
    }

    exitSpecialModes();

    GRID_N = size;
    frames[currentFrame] = loadedTargetFrame;

    history = [];
    btnUndo.disabled = true;

    if (Number.isInteger(data.fg) && data.fg >= 0 && data.fg <= 15) {
      fgIndices[currentFrame] = data.fg;
    }
    if (Number.isInteger(data.bg) && data.bg >= 0 && data.bg <= 15) {
      bgIndices[currentFrame] = data.bg;
    }

    buildGridDOM();
    renderAll();
    fitGrid();
    return "loaded (Slot " + (currentFrame + 1) + " / " + size + "x" + size + ")";
  }

  document.getElementById("fileInput").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { flash(importJSONText(reader.result)); }
      catch (e) { flash("could not read that file: " + e.message); }
    };
    reader.readAsText(file);
    ev.target.value = "";
  });

  // ---------- misc UI ----------
  var liveMsg = document.getElementById("liveMsg");
  var flashTimer = null;
  function flash(msg) {
    liveMsg.textContent = msg;
    liveMsg.classList.add("show");
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { liveMsg.classList.remove("show"); }, 2200);
  }

  var gridWrapEl = document.querySelector(".gridwrap");
  var STACKED_MQ = window.matchMedia("(max-width: 760px)");
  function fitGrid() {
    var cs = getComputedStyle(gridWrapEl);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);

    var BORDERS_Y = 40;
    var BORDERS_X = 8;

    var availW = gridWrapEl.clientWidth - padX - BORDERS_X;
    var size;
    if (STACKED_MQ.matches) {
      size = Math.floor(availW);
    } else {
      var availH = gridWrapEl.clientHeight - padY - BORDERS_Y;
      size = Math.floor(Math.min(availW, availH));
    }
    size = Math.max(120, size);

    document.documentElement.style.setProperty("--grid-size", size + "px");
  }
  window.addEventListener("resize", fitGrid);

  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(fitGrid).observe(gridWrapEl);
  }

  // ---------- boot ----------
  buildGridDOM();
  renderAll();
  fitGrid();
})();
</script>
</body>
